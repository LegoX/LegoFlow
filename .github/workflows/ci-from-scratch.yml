name: CI (from-scratch rebuild)

# Manual-only opt-in workflow. The default CI in `ci.yml` uses the hybrid
# symlink-from-canonical pattern for speed. This workflow exists for the
# rare cases where you suspect the canonical machine's runtime state has
# drifted from what the PR's source code expects (e.g. a dep change in
# pyproject.toml, a submodule commit bump, or a pulled Docker image), and
# you want CI to validate the PR against a freshly built environment.
#
# Trigger: run this workflow manually from the repository's Actions tab.
#
# What it does, per block:
#   - Source-only checkout of the PR's branch (no canonical symlinks).
#   - Clones private submodules using a PAT from the operator-configured
#     shared CI directory (HOME is isolated so ~/.gitconfig is never mutated).
#   - Builds the venv / uv envs from scratch using shared pip + uv caches.
#   - Pulls the agent runtime image.
#   - Initializes the processed-tasks ledger if missing.
#   - Runs `tests/run.sh` (+ `--with-smoke` if requested).

on:
  workflow_dispatch:
    inputs:
      block:
        description: "Which block to rebuild + test"
        type: choice
        options: [curator, tracer, evaluator, trainer, all]
        default: all
      run_smoke:
        description: "Also run the smoke tests (~30 min each, real LLM + Docker)"
        type: boolean
        default: false
      ref:
        description: "Branch / tag / commit to test (defaults to the workflow source ref)"
        type: string
        default: ""

concurrency:
  group: ci-from-scratch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CICD_SHARED: ${{ vars.LEGOFLOW_CI_SHARED || '/opt/legoflow-ci/shared' }}

jobs:
  # ===========================================================================
  # curator — fresh venv + repos/legoflow-curator submodule
  # ===========================================================================
  curator:
    name: curator (from-scratch)
    if: ${{ inputs.block == 'curator' || inputs.block == 'all' }}
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
      - name: Stage shared CI env + isolated HOME + PAT
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/.github/scripts/load_shared_ci_env.sh"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          [ -n "$PAT" ] || { echo "ERROR: no PAT in $CICD_SHARED/gh_token.txt"; exit 1; }
          echo "::add-mask::$PAT"
          # Per-job HOME so `git config --global` never touches the runner
          # user's real ~/.gitconfig (which is shared with their interactive
          # shell). Without this, every CI run pollutes the host gitconfig.
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          HOME="$CI_HOME" git config --global user.email "ci@legoflow.local"
          HOME="$CI_HOME" git config --global user.name "legoflow-ci"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          # actions/checkout sets a per-repo extraheader with the workflow's
          # GITHUB_TOKEN; that token can't see private LegoX submodules, so
          # it must not override our PAT-embedded URL rewrites.
          git -C "$GITHUB_WORKSPACE" config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Init curator submodule
        run: git submodule update --init --depth 1 blocks/curator/repos/legoflow-curator
      - name: Build curator venv from scratch
        working-directory: blocks/curator
        run: |
          set -euo pipefail
          rm -rf artifacts/envs/legoflow-curator-env
          python3 -m venv artifacts/envs/legoflow-curator-env
          artifacts/envs/legoflow-curator-env/bin/pip install --upgrade pip
          artifacts/envs/legoflow-curator-env/bin/pip install -e repos/legoflow-curator/
      - name: Stage gh_token.txt
        run: cp "$CICD_SHARED/gh_token.txt" blocks/curator/gh_token.txt
      - name: Run curator test cases
        working-directory: blocks/curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Run curator smoke (if requested)
        if: ${{ inputs.run_smoke == true }}
        working-directory: blocks/curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-from-scratch-logs-${{ github.run_id }}
          path: |
            blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py.log
            blocks/curator/artifacts/swe_tasks/py-cc-smoke/verifiable_tasks.txt
            blocks/curator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # tracer — fresh harbor + legoflow_trace_crafter + litellm envs, pulled image
  # ===========================================================================
  tracer:
    name: tracer (from-scratch)
    if: ${{ inputs.block == 'tracer' || inputs.block == 'all' }}
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 90
    env:
      RUNTIME_IMAGE: docker.io/jierun/c-cc-2.1.118:v0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
      - name: Stage shared CI env + isolated HOME + PAT
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/.github/scripts/load_shared_ci_env.sh"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          [ -n "$PAT" ] || { echo "ERROR: no PAT in $CICD_SHARED/gh_token.txt"; exit 1; }
          echo "::add-mask::$PAT"
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          HOME="$CI_HOME" git config --global user.email "ci@legoflow.local"
          HOME="$CI_HOME" git config --global user.name "legoflow-ci"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git -C "$GITHUB_WORKSPACE" config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Clone harbor + legoflow_trace_crafter via config-managed URLs
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          # Use scripts/update_repos.sh for BOTH repos so the saved `origin` URL
          # matches `meta_info.repositories.<name>.url` in config.yaml exactly.
          # `git submodule update --init` would write the .gitmodules URL
          # (git@github.com:…), which the PAT insteadOf rewrites only at
          # transport, so cases/02_repo_pins.sh's `git remote get-url origin`
          # equality check would always fail with an origin URL mismatch.
          bash scripts/update_repos.sh --repo harbor
          bash scripts/update_repos.sh --repo legoflow_trace_crafter
      - name: Build harbor uv env from scratch
        working-directory: blocks/tracer
        run: |
          rm -rf artifacts/env/harbor-uv
          bash scripts/setup_harbor_env.sh
      - name: Build legoflow_trace_crafter uv env from scratch
        working-directory: blocks/tracer
        run: |
          rm -rf artifacts/env/legoflow-trace-crafter-uv
          bash scripts/setup_legoflow_trace_crafter_env.sh
      - name: Build litellm venv from scratch
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          rm -rf artifacts/env/litellm-venv
          uv venv artifacts/env/litellm-venv --python 3.13
          uv pip install --python artifacts/env/litellm-venv/bin/python 'litellm[proxy]==1.83.14'
      - name: Pull agent runtime image + materialize runtime_host_path
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE"
          # `config.yaml` sets `agent.runtime_host_path: artifacts/agent-runtime/claude-code`.
          # start.sh treats a non-empty host_path as a bind-mount source, so if
          # the dir is missing/empty Harbor mounts nothing at /opt/custom-agent-runtime/
          # and every trial fails at agent setup. Extract the runtime tree from
          # the pulled image once so the smoke + tests have a real bind source.
          if [ ! -d artifacts/agent-runtime/claude-code ] || [ -z "$(ls -A artifacts/agent-runtime/claude-code 2>/dev/null)" ]; then
            mkdir -p artifacts/agent-runtime
            CID=$(docker create "$RUNTIME_IMAGE")
            trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
            rm -rf artifacts/agent-runtime/claude-code
            docker cp "$CID:/opt/custom-agent-runtime/claude-code" artifacts/agent-runtime/claude-code
          fi
      - name: Initialize processed-tasks ledger if missing
        working-directory: blocks/tracer
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/processed_tasks.yaml ]; then
            printf 'description: %s\nruns: []\n' "tracer task processed-tasks ledger" \
              > artifacts/processed_tasks.yaml
          fi
      - name: Run tracer test cases
        working-directory: blocks/tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Run tracer smoke (if requested)
        if: ${{ inputs.run_smoke == true }}
        working-directory: blocks/tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-from-scratch-logs-${{ github.run_id }}
          path: |
            blocks/tracer/artifacts/logs/
            blocks/tracer/artifacts/jobs/smoke/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # evaluator — fresh harbor + litellm envs, extracted agent runtime, pulled image
  # ===========================================================================
  evaluator:
    name: evaluator (from-scratch)
    if: ${{ inputs.block == 'evaluator' || inputs.block == 'all' }}
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 75
    env:
      RUNTIME_IMAGE: docker.io/jierun/c-oh-sdk-1.14.0:v0.1
      RUNTIME_SUBPATH: oh-sdk
      RUNTIME_HOST_DIR: artifacts/runtime/openhands-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
      - name: Stage shared CI env + isolated HOME + PAT
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/.github/scripts/load_shared_ci_env.sh"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          [ -n "$PAT" ] || { echo "ERROR: no PAT in $CICD_SHARED/gh_token.txt"; exit 1; }
          echo "::add-mask::$PAT"
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          HOME="$CI_HOME" git config --global user.email "ci@legoflow.local"
          HOME="$CI_HOME" git config --global user.name "legoflow-ci"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git -C "$GITHUB_WORKSPACE" config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Init harbor submodule
        run: git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 blocks/evaluator/repos/harbor
      - name: Build harbor uv env from scratch
        working-directory: blocks/evaluator
        run: |
          set -euo pipefail
          rm -rf artifacts/env/harbor-uv
          ( cd repos/harbor && UV_PROJECT_ENVIRONMENT="$PWD/../../artifacts/env/harbor-uv" uv sync --all-extras )
      - name: Build litellm venv from scratch
        working-directory: blocks/evaluator
        run: |
          set -euo pipefail
          rm -rf artifacts/env/litellm-venv
          uv venv artifacts/env/litellm-venv --python 3.13
          uv pip install --python artifacts/env/litellm-venv/bin/python 'litellm[proxy]==1.83.14'
      - name: Pull agent runtime image
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: docker pull "$RUNTIME_IMAGE"
      - name: Extract agent runtime into runtime_host_path
        working-directory: blocks/evaluator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          CID=$(docker create "$RUNTIME_IMAGE")
          rm -rf "$RUNTIME_HOST_DIR" && mkdir -p "$(dirname "$RUNTIME_HOST_DIR")"
          docker cp "$CID:/opt/custom-agent-runtime/$RUNTIME_SUBPATH" "$RUNTIME_HOST_DIR"
          docker rm "$CID"
      - name: Initialize artifacts/index.yaml if missing
        working-directory: blocks/evaluator
        run: |
          mkdir -p artifacts
          [ -f artifacts/index.yaml ] || printf 'runs: []\n' > artifacts/index.yaml
      - name: Run evaluator test cases
        working-directory: blocks/evaluator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Run evaluator smoke (if requested)
        if: ${{ inputs.run_smoke == true }}
        working-directory: blocks/evaluator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-from-scratch-logs-${{ github.run_id }}
          path: |
            blocks/evaluator/artifacts/logs/
            blocks/evaluator/artifacts/jobs/smoke/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # trainer — fresh LLaMA-Factory + legoflow_trace_crafter submodules + uv training env
  # ===========================================================================
  trainer:
    name: trainer (from-scratch)
    if: ${{ inputs.block == 'trainer' || inputs.block == 'all' }}
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
      - name: Stage shared CI env + isolated HOME + PAT
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/.github/scripts/load_shared_ci_env.sh"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          [ -n "$PAT" ] || { echo "ERROR: no PAT in $CICD_SHARED/gh_token.txt"; exit 1; }
          echo "::add-mask::$PAT"
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          HOME="$CI_HOME" git config --global user.email "ci@legoflow.local"
          HOME="$CI_HOME" git config --global user.name "legoflow-ci"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          HOME="$CI_HOME" git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git -C "$GITHUB_WORKSPACE" config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$PATH"
            # HF creds + shared cache so the optional smoke's prepare_smoke_data.sh
            # (load_dataset) can pull Lego-X/samples_for_llama_factory_sft even
            # if it's gated/uncached — matches the other from-scratch jobs.
            echo "HF_TOKEN=${HF_TOKEN:-}"
            echo "HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}"
            echo "HF_HOME=${HF_HOME:-}"
          } >> "$GITHUB_ENV"
      - name: Init submodules (LLaMA-Factory + LegoFlow-Trace-Crafter)
        # The PAT url-rewrite above is still used for other private clones in
        # this workflow. LegoFlow-Trace-Crafter is public and lives at
        # blocks/trainer/repos/LegoFlow-Trace-Crafter.
        run: git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 blocks/trainer/repos/LLaMA-Factory blocks/trainer/repos/LegoFlow-Trace-Crafter
      - name: Build trainer uv env from scratch
        working-directory: blocks/trainer
        env:
          UV_LINK_MODE: copy
        run: bash scripts/install_env.sh
      - name: Run trainer test cases
        working-directory: blocks/trainer
        run: bash tests/run.sh
      - name: Stage + run trainer smoke (if requested)
        if: ${{ inputs.run_smoke == true }}
        working-directory: blocks/trainer
        # Snapshot the 512-sample dataset into the block (local_lf source), then
        # run the GPU training smoke. The smoke SKIPs gracefully if this
        # from-scratch runner lacks the base model or idle GPUs.
        run: |
          bash tests/smoke/prepare_smoke_data.sh "$PWD/artifacts/data/examples/lf_512.json"
          bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-from-scratch-logs-${{ github.run_id }}
          path: |
            blocks/trainer/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14
