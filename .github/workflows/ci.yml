          # Link it only if seeded — a missing snapshot must let the smoke SKIP
          # (exit 77), not fail the job, on a freshly-registered GPU runner.
          if [ -s "$CANON/artifacts/data/examples/lf_512.json" ]; then
            ln -s "$CANON/artifacts/data/examples" artifacts/data/examples
          else
            echo "WARNING: staged smoke dataset missing at $CANON/artifacts/data/examples/lf_512.json — the smoke will SKIP. Seed it with: bash blocks/trainer/tests/smoke/prepare_smoke_data.sh"
