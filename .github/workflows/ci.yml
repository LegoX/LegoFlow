name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run subblock smoke tests (real LLM tokens + Docker, ~30 min each)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Option B: every per-block job builds the runtime from scratch using the PR's
# source code. Secrets and caches live in /gpufs/haoli/cicd/shared on the
# self-hosted runner (see /gpufs/haoli/cicd/shared/README.md for layout).
# The canonical block tree at /gpufs/haoli/code/SWE-Lego-Live is NOT read by CI.
env:
  CICD_SHARED: /gpufs/haoli/cicd/shared

jobs:
  # --- Cheap cloud job: structural sanity of the block tree -------------------
  root-block:
    name: Root block sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install --no-cache-dir pytest pyyaml
      - name: Run root block tests
        run: pytest tests/test_root_block.py -v

  # --- Decide which subblocks need their CI run -------------------------------
  detect-changes:
    name: Detect changed subblocks
    runs-on: ubuntu-latest
    outputs:
      swegen: ${{ steps.filter.outputs.swegen }}
      trajgen: ${{ steps.filter.outputs.trajgen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swegen:
              - 'subblock/swegen/**'
              - '.github/workflows/ci.yml'
            trajgen:
              - 'subblock/trajgen/**'
              - '.github/workflows/ci.yml'

  # ===========================================================================
  # swegen
  # ===========================================================================
  swegen-cases:
    name: swegen tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.swegen == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Stage shared CI env + private submodule auth
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          [ -n "$PAT" ] || { echo "ERROR: no PAT in $CICD_SHARED/gh_token.txt"; exit 1; }
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          {
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
          } >> "$GITHUB_ENV"
      - name: Init swegen submodule
        run: git submodule update --init --depth 1 subblock/swegen/repos/swegen
      - name: Build swegen venv (clean)
        working-directory: subblock/swegen
        run: |
          set -euo pipefail
          python3 -m venv artifacts/envs/swegen-env
          artifacts/envs/swegen-env/bin/pip install --upgrade pip
          artifacts/envs/swegen-env/bin/pip install -e repos/swegen/
      - name: Stage gh_token.txt
        run: cp "$CICD_SHARED/gh_token.txt" subblock/swegen/gh_token.txt
      - name: Run swegen test cases
        working-directory: subblock/swegen
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swegen-cases-logs-${{ github.run_id }}
          path: |
            subblock/swegen/artifacts/swe_tasks/.swegen-smoke-py.log
            subblock/swegen/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  swegen-smoke:
    name: swegen tests (smoke)
    needs: [detect-changes, swegen-cases]
    if: |
      needs.detect-changes.outputs.swegen == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true) ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Stage shared CI env + private submodule auth
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          {
            echo "HF_TOKEN=$HF_TOKEN"; echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"; echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"; echo "UV_CACHE_DIR=$UV_CACHE_DIR"
          } >> "$GITHUB_ENV"
      - name: Init swegen submodule
        run: git submodule update --init --depth 1 subblock/swegen/repos/swegen
      - name: Build swegen venv (clean)
        working-directory: subblock/swegen
        run: |
          python3 -m venv artifacts/envs/swegen-env
          artifacts/envs/swegen-env/bin/pip install --upgrade pip
          artifacts/envs/swegen-env/bin/pip install -e repos/swegen/
      - name: Stage gh_token.txt
        run: cp "$CICD_SHARED/gh_token.txt" subblock/swegen/gh_token.txt
      - name: Run swegen smoke (--with-smoke)
        working-directory: subblock/swegen
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swegen-smoke-logs-${{ github.run_id }}
          path: |
            subblock/swegen/artifacts/swe_tasks/.swegen-smoke-py.log
            subblock/swegen/artifacts/swe_tasks/py-cc-smoke/verifiable_tasks.txt
            subblock/swegen/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # trajgen
  # ===========================================================================
  trajgen-cases:
    name: trajgen tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.trajgen == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 25
    env:
      RUNTIME_IMAGE: docker.io/jierun/c-cc-2.1.118:v0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Stage shared CI env + private submodule auth
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          {
            echo "HF_TOKEN=$HF_TOKEN"; echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"; echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"; echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/home/haoli/.uv/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Init trajgen submodules + clone swe_data_process
        working-directory: subblock/trajgen
        run: |
          set -euo pipefail
          # harbor is a real submodule
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 subblock/trajgen/repos/harbor
          # swe_data_process is managed via scripts/update_repos.sh
          bash scripts/update_repos.sh --repo swe_data_process
      - name: Build harbor uv env (clean)
        working-directory: subblock/trajgen
        run: bash scripts/setup_harbor_env.sh
      - name: Build swe_data_process uv env (clean)
        working-directory: subblock/trajgen
        run: bash scripts/setup_swe_data_process_env.sh
      - name: Build litellm venv (clean, Python 3.13)
        working-directory: subblock/trajgen
        run: |
          set -euo pipefail
          uv venv artifacts/env/litellm-venv --python 3.13
          uv pip install --python artifacts/env/litellm-venv/bin/python 'litellm[proxy]==1.83.14'
      - name: Ensure agent runtime image pulled
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: docker pull "$RUNTIME_IMAGE"
      - name: Initialize consumption ledger (idempotent)
        working-directory: subblock/trajgen
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/consumption_ledger.yaml ]; then
            printf 'description: %s\nruns: []\n' "trajgen task consumption ledger" \
              > artifacts/consumption_ledger.yaml
          fi
      - name: Run trajgen test cases
        working-directory: subblock/trajgen
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trajgen-cases-logs-${{ github.run_id }}
          path: subblock/trajgen/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  trajgen-smoke:
    name: trajgen tests (smoke)
    needs: [detect-changes, trajgen-cases]
    if: |
      needs.detect-changes.outputs.trajgen == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true) ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 60
    env:
      RUNTIME_IMAGE: docker.io/jierun/c-cc-2.1.118:v0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Stage shared CI env + private submodule auth
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          PAT=$(grep -vE '^[[:space:]]*(#|$)' "$CICD_SHARED/gh_token.txt" | head -1 | cut -d, -f1)
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          {
            echo "HF_TOKEN=$HF_TOKEN"; echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"; echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"; echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/home/haoli/.uv/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Init trajgen submodules + clone swe_data_process
        working-directory: subblock/trajgen
        run: |
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 subblock/trajgen/repos/harbor
          bash scripts/update_repos.sh --repo swe_data_process
      - name: Build harbor uv env
        working-directory: subblock/trajgen
        run: bash scripts/setup_harbor_env.sh
      - name: Build swe_data_process uv env
        working-directory: subblock/trajgen
        run: bash scripts/setup_swe_data_process_env.sh
      - name: Build litellm venv
        working-directory: subblock/trajgen
        run: |
          uv venv artifacts/env/litellm-venv --python 3.13
          uv pip install --python artifacts/env/litellm-venv/bin/python 'litellm[proxy]==1.83.14'
      - name: Pull agent runtime image
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: docker pull "$RUNTIME_IMAGE"
      - name: Initialize consumption ledger
        working-directory: subblock/trajgen
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/consumption_ledger.yaml ]; then
            printf 'description: %s\nruns: []\n' "trajgen task consumption ledger" \
              > artifacts/consumption_ledger.yaml
          fi
      - name: Run trajgen smoke (--with-smoke)
        working-directory: subblock/trajgen
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh --with-smoke
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajgen-smoke-logs-${{ github.run_id }}
          path: |
            subblock/trajgen/artifacts/logs/
            subblock/trajgen/artifacts/jobs-smoke/
          if-no-files-found: ignore
          retention-days: 14
