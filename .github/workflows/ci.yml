      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/evaluator
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/evaluator"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh evaluator"; exit 1; }
          mkdir -p repos artifacts
          rm -rf repos/harbor artifacts/env artifacts/runtime artifacts/index.yaml
          ln -s "$CANON/repos/harbor"        repos/harbor
          ln -s "$CANON/artifacts/env"       artifacts/env
          ln -s "$CANON/artifacts/runtime"   artifacts/runtime
          [ -f "$CANON/artifacts/index.yaml" ] && ln -s "$CANON/artifacts/index.yaml" artifacts/index.yaml \
            || printf 'runs: []\n' > artifacts/index.yaml
      - name: Overlay smoke config.yaml from subblock/evaluator/tests/smoke
        run: cp subblock/evaluator/tests/smoke/config.yaml subblock/evaluator/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh evaluator
        env:
