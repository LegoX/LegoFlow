    if: |
      always() && needs.evaluator-cases.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.smoke_scope == 'subblocks' || inputs.smoke_scope == 'all')) ||
        (needs.detect-changes.outputs.evaluator == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 55
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/evaluator
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/evaluator"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh evaluator"; exit 1; }
          mkdir -p repos artifacts
          rm -rf repos/harbor artifacts/env artifacts/runtime artifacts/index.yaml
          ln -s "$CANON/repos/harbor"        repos/harbor
          ln -s "$CANON/artifacts/env"       artifacts/env
          ln -s "$CANON/artifacts/runtime"   artifacts/runtime
          [ -f "$CANON/artifacts/index.yaml" ] && ln -s "$CANON/artifacts/index.yaml" artifacts/index.yaml \
            || printf 'runs: []\n' > artifacts/index.yaml
      - name: Overlay smoke config.yaml from subblock/evaluator/tests/smoke
        # The template carries no endpoint/key; inject them from the
        # shared env into the COPY (never back into the template).
        run: |
          set -euo pipefail
          source /gpufs/haoli/cicd/shared/.env
          cp subblock/evaluator/tests/smoke/config.yaml subblock/evaluator/config.yaml
          python3 scripts/inject_smoke_secrets.py subblock/evaluator/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh evaluator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          LITELLM_NUM_WORKERS: "1"
        run: bash .github/scripts/smoke_run.sh evaluator 2400
      - name: Verify smoke
        if: always()
        run: bash subblock/evaluator/tests/smoke/verify.sh
      - name: Upload logs
        if: always()
        continue-on-error: true   # harbor's root-owned agent/sessions can survive cleanup → upload EACCES, don't fail the job
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-smoke-logs-${{ github.run_id }}
          path: |
            subblock/evaluator/artifacts/logs/
            subblock/evaluator/artifacts/jobs/smoke/
            subblock/evaluator/artifacts/litellm/
          if-no-files-found: ignore
          retention-days: 14

  # --- trainer: cheap test cases -------------------------------------------------
  trainer-cases:
    name: trainer tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.trainer == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 30   # cpfs cold-cache imports (swe_data_process converters) hit ~7 min each
    steps:
      - name: Pre-checkout — reclaim residue from prior runs
        # trainer-cases doesn't write root-owned files itself, but a co-tenant
        # tracer/evaluator smoke on this runner might have; reclaim and drop
        # everyone's smoke residue so actions/checkout's workspace-clean
        # never trips on EACCES.
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      # Source-only checkout — submodules + uv env come from $SHARED_RUNTIME.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/trainer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/trainer"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh trainer"; exit 1; }
          # actions/checkout creates empty placeholder dirs for declared
          # submodules; ln -sfn would put the link INSIDE them. rm -rf first.
          # The tracked scripts/deepspeed/*.json come from the
          # checkout (case 07), so only repos/ + the uv env are symlinked.
          mkdir -p repos artifacts
          rm -rf repos/LLaMA-Factory repos/swe_data_process artifacts/env
          ln -s "$CANON/repos/LLaMA-Factory"     repos/LLaMA-Factory
          ln -s "$CANON/repos/swe_data_process"  repos/swe_data_process
          ln -s "$CANON/artifacts/env"           artifacts/env
          ls -la repos artifacts
      - name: Run trainer test cases
        working-directory: subblock/trainer
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-cases-logs-${{ github.run_id }}
          path: subblock/trainer/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- trainer: GPU training smoke (gated) --------------------------------------
  trainer-smoke:
    name: trainer tests (smoke)
    needs: [detect-changes, trainer-cases]
    # `always()` so a manual smoke_scope dispatch isn't cascade-skipped just
    # because trainer-cases was skipped (no path diff vs dev — the normal
    # state right after this branch merges). Still blocks on an actual
    # trainer-cases FAILURE; only a SKIP (no diff) is tolerated.
    if: |
      always() && needs.trainer-cases.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.smoke_scope == 'subblocks' || inputs.smoke_scope == 'all')) ||
        (needs.detect-changes.outputs.trainer == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    # The swe-lego-ci runner orchestrates either a configured remote GPU host
    # (private sft-remote.env) or a local GPU. Missing/failed prerequisites are
    # real failures; this job is green only after guarded training completes.
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 75
    steps:
      - name: Pre-checkout — reclaim residue from prior runs
        # Reclaim anything not owned by uid 1000 so checkout's workspace-clean
        # never trips on EACCES, and drop any leftover _smoke_* run dirs from a
        # killed prior smoke (the in-script trap normally removes them).
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      # Source-only checkout — submodules + uv env come from $SHARED_RUNTIME.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/trainer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/trainer"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh trainer"; exit 1; }
          mkdir -p repos artifacts artifacts/data
          rm -rf repos/LLaMA-Factory repos/swe_data_process artifacts/env artifacts/data/examples
          ln -s "$CANON/repos/LLaMA-Factory"     repos/LLaMA-Factory
          ln -s "$CANON/repos/swe_data_process"  repos/swe_data_process
          ln -s "$CANON/artifacts/env"           artifacts/env
          # The 512-sample snapshot the local_lf smoke trains on (source.type
          # is overridden to local_lf by the smoke's disposable config copy).
          # Link it only if seeded — a missing snapshot must let the smoke SKIP
          # (exit 77), not fail the job, on a freshly-registered GPU runner.
          if [ -s "$CANON/artifacts/data/examples/lf_512.json" ]; then
            ln -s "$CANON/artifacts/data/examples" artifacts/data/examples
          else
            echo "WARNING: staged smoke dataset missing at $CANON/artifacts/data/examples/lf_512.json — the smoke will SKIP. Seed it with: bash subblock/trainer/tests/smoke/prepare_smoke_data.sh"
          fi
          ls -la repos artifacts artifacts/data
      - name: Run guarded SFT training smoke
        run: bash .github/scripts/sft_smoke_run.sh 2700
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-smoke-logs-${{ github.run_id }}
          path: subblock/trainer/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  # --- root: CHAINED end-to-end smoke (manual dispatch only) -----------------
  # Runs tests/smoke/run_pipeline.sh, which overlays each tests/smoke/<block>/
  # config.yaml and runs all four blocks in sequence (curator -> tracer -> trainer
  # -> evaluator), feeding each block's real output into the next. Far heavier than
  # the per-block smokes (hours; touches the remote GPU pod for trainer + serving),
  # so it is workflow_dispatch-only and never runs on push. Set `root_budget`
  # (e.g. 1800) for a quick pass; blank uses the config defaults (curator 4h),
  # which can exceed the 6h job cap — tune accordingly.
  root-smoke:
    name: root smoke (chained end-to-end)
    needs: root-block
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.smoke_scope == 'root' || inputs.smoke_scope == 'all')
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 420   # 7h: real trainer training (~3h20m) + curator/tracer/eval; self-hosted has no GH cap
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/root-smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/root-smoke-src-tasks /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/root-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-root-smoke /x/SWE-Lego-Live/subblock/trainer/artifacts/model/root_smoke_model 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"; mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state for ALL blocks (curator, tracer, trainer, evaluator)
        run: |
          set -euo pipefail
          # curator — venv + repo + gh_token
          C="${SHARED_RUNTIME}/curator"; cd "$GITHUB_WORKSPACE/subblock/curator"
          mkdir -p repos artifacts
          rm -rf repos/swegen artifacts/envs gh_token.txt
          ln -s "$C/repos/swegen" repos/swegen
          ln -s "$C/artifacts/envs" artifacts/envs
          [ -f "$C/gh_token.txt" ] && ln -s "$C/gh_token.txt" gh_token.txt || true
          # tracer — uv envs + repos + agent runtime + ledger
          C="${SHARED_RUNTIME}/tracer"; cd "$GITHUB_WORKSPACE/subblock/tracer"
          mkdir -p repos artifacts
          rm -rf repos/harbor repos/swe_data_process artifacts/env artifacts/agent-runtime artifacts/processed_tasks.yaml
          ln -s "$C/repos/harbor" repos/harbor
          ln -s "$C/repos/swe_data_process" repos/swe_data_process
          ln -s "$C/artifacts/env" artifacts/env
          [ -d "$C/artifacts/agent-runtime" ] && ln -s "$C/artifacts/agent-runtime" artifacts/agent-runtime || true
          [ -f "$C/artifacts/processed_tasks.yaml" ] && ln -s "$C/artifacts/processed_tasks.yaml" artifacts/processed_tasks.yaml || true
          # trainer — uv env + repos + 512 fixture (remote pod hosts the GPUs)
          C="${SHARED_RUNTIME}/trainer"; cd "$GITHUB_WORKSPACE/subblock/trainer"
          mkdir -p repos artifacts artifacts/data
          rm -rf repos/LLaMA-Factory repos/swe_data_process artifacts/env artifacts/data/examples
          ln -s "$C/repos/LLaMA-Factory" repos/LLaMA-Factory
          ln -s "$C/repos/swe_data_process" repos/swe_data_process
          ln -s "$C/artifacts/env" artifacts/env
          [ -s "$C/artifacts/data/examples/lf_512.json" ] && ln -s "$C/artifacts/data/examples" artifacts/data/examples || true
          # evaluator — uv env + repo + agent runtime
          C="${SHARED_RUNTIME}/evaluator"; cd "$GITHUB_WORKSPACE/subblock/evaluator"
          mkdir -p repos artifacts
          rm -rf repos/harbor artifacts/env artifacts/runtime artifacts/index.yaml
          ln -s "$C/repos/harbor" repos/harbor
          ln -s "$C/artifacts/env" artifacts/env
          ln -s "$C/artifacts/runtime" artifacts/runtime
          [ -f "$C/artifacts/index.yaml" ] && ln -s "$C/artifacts/index.yaml" artifacts/index.yaml || printf 'runs: []\n' > artifacts/index.yaml
      - name: Run the ROOT chained smoke
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          LITELLM_NUM_WORKERS: "1"
          # Pass the dispatch input through the environment (not string-spliced
          # into the script) so a crafted value like $(...) cannot execute — and
          # validate it is digits before use. See PR #54 P1 review.
          ROOT_BUDGET: ${{ inputs.root_budget }}
        # HOME=/home/haoli so the in-chain `claude -p` launcher finds its auth
        # (mirrors .github/scripts/smoke_run.sh); CLAUDE_SDK=1 uses that launcher.
        run: |
          set -uo pipefail
          BUDGET_ARG=""
          if [ -n "$ROOT_BUDGET" ]; then
            case "$ROOT_BUDGET" in
              *[!0-9]*) echo "ERROR: root_budget must be digits, got: $ROOT_BUDGET" >&2; exit 2 ;;
            esac
            BUDGET_ARG="--budget $ROOT_BUDGET"
          fi
          HOME=/home/haoli CLAUDE_SDK=1 bash tests/smoke/run_pipeline.sh $BUDGET_ARG
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: root-smoke-logs-${{ github.run_id }}
          path: |
            .root-smoke-run.log
            subblock/*/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14
