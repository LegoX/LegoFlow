name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run subblock smoke tests (real LLM tokens + Docker, ~30 min each)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# SHARED_RUNTIME is read by the per-block "Link runtime state" steps. It points
# at a self-contained mirror of the runtime state CI needs — venvs / uv envs /
# pinned submodule checkouts / agent-runtime / consumption ledger / gh_token —
# living entirely under /gpufs (NOT under /, NOT under the canonical block
# tree). Rebuild it from the canonical tree with /gpufs/haoli/cicd/sync_runtime.sh.
env:
  SHARED_RUNTIME: /gpufs/haoli/cicd/shared/runtime

jobs:
  # --- Cheap cloud job: structural sanity of the block tree -------------------
  root-block:
    name: Root block sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --no-cache-dir pytest pyyaml

      - name: Run root block tests
        run: pytest tests/test_root_block.py -v

  # --- Decide which subblocks need their CI run -------------------------------
  detect-changes:
    name: Detect changed subblocks
    runs-on: ubuntu-latest
    outputs:
      curator: ${{ steps.filter.outputs.curator }}
      tracer: ${{ steps.filter.outputs.tracer }}
      evaluator: ${{ steps.filter.outputs.evaluator }}
      trainer: ${{ steps.filter.outputs.trainer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            curator:
              - 'subblock/curator/**'
              - '.github/workflows/ci.yml'
            tracer:
              - 'subblock/tracer/**'
              - '.github/workflows/ci.yml'
            evaluator:
              - 'subblock/evaluator/**'
              - '.github/workflows/ci.yml'
            trainer:
              - 'subblock/trainer/**'
              - '.github/workflows/ci.yml'

  # --- curator: cheap test cases (self-hosted, fixed-paths CI runner) ---------
  curator-cases:
    name: curator tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.curator == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 30   # cpfs cold-cache uv-env-editable case can take ~7 min
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      # Source-only checkout — submodules + venvs come from $SHARED_RUNTIME.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/curator
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/curator"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh curator"; exit 1; }
          # actions/checkout creates empty placeholder dirs for declared
          # submodules; ln -sfn would put the link INSIDE them. rm -rf first.
          mkdir -p repos artifacts artifacts/swe_tasks
          rm -rf repos/swegen artifacts/envs artifacts/swe_tasks/py-cc gh_token.txt
          ln -s "$CANON/repos/swegen"        repos/swegen
          ln -s "$CANON/artifacts/envs"      artifacts/envs
          [ -f "$CANON/gh_token.txt" ] && ln -s "$CANON/gh_token.txt" gh_token.txt || true
          # Optional Harbor smoke fixture (case 06 SKIPs if absent)
          [ -d "$CANON/artifacts/swe_tasks/py-cc" ] && \
            ln -s "$CANON/artifacts/swe_tasks/py-cc" artifacts/swe_tasks/py-cc || true
          ls -la repos artifacts artifacts/swe_tasks
      - name: Run curator test cases
        working-directory: subblock/curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: curator-cases-logs-${{ github.run_id }}
          path: |
            subblock/curator/artifacts/swe_tasks/.swegen-smoke-py.log
            subblock/curator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- curator: end-to-end 10-PR smoke (~30 min) ------------------------------
  curator-smoke:
    name: curator tests (smoke)
    needs: [detect-changes, curator-cases]
    if: |
      needs.detect-changes.outputs.curator == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true) ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 70
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/curator
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/curator"
          mkdir -p repos artifacts
          rm -rf repos/swegen artifacts/envs gh_token.txt
          ln -s "$CANON/repos/swegen"        repos/swegen
          ln -s "$CANON/artifacts/envs"      artifacts/envs
          [ -f "$CANON/gh_token.txt" ] && ln -s "$CANON/gh_token.txt" gh_token.txt || true
      - name: Overlay smoke config.yaml from subblock/curator/tests/smoke
        run: cp subblock/curator/tests/smoke/config.yaml subblock/curator/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash .github/scripts/smoke_run.sh curator 3600
      - name: Verify smoke
        if: always()
        shell: bash {0}    # no -e — let verify.sh exit 77 fall through to the SKIP mapping
        run: |
          bash subblock/curator/tests/smoke/verify.sh
          rc=$?
          if [[ $rc -eq 77 ]]; then echo "::warning::curator smoke SKIPped"; exit 0; fi
          exit $rc
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-smoke-logs-${{ github.run_id }}
          path: |
            subblock/curator/artifacts/swe_tasks/.swegen-smoke-py.log
            subblock/curator/artifacts/swe_tasks/py-cc-smoke/verifiable_tasks.txt
            subblock/curator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  # --- tracer: cheap test cases ---------------------------------------------
  tracer-cases:
    name: tracer tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.tracer == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 30   # cpfs cold-cache uv-env-editable case can take ~7 min
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        # Prior tracer smokes drop root-owned files in the workspace —
        # Harbor's bind-mounted agent-runtime AND Docker trial containers
        # running as root drop sessions/state under jobs/smoke/. Any of
        # these makes actions/checkout's workspace-clean fail with EACCES.
        # Run docker (which IS root on the daemon) to chown anything in the
        # workspace not owned by uid 1000 back to us. Idempotent.
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/tracer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/tracer"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh tracer"; exit 1; }
          mkdir -p repos artifacts
          rm -rf repos/harbor repos/swe_data_process artifacts/env artifacts/agent-runtime artifacts/consumption_ledger.yaml
          ln -s "$CANON/repos/harbor"                       repos/harbor
          ln -s "$CANON/repos/swe_data_process"             repos/swe_data_process
          ln -s "$CANON/artifacts/env"                      artifacts/env
          # agent.runtime_host_path: harbor bind-mounts this into every trial
          # container at /opt/custom-agent-runtime/claude-code. Without the
          # symlink the workspace dir is empty → "Mounted runtime detection
          # failed" → fallback `curl claude.ai/install.sh` → 403 → 0 trajectories.
          [ -d "$CANON/artifacts/agent-runtime" ] && \
            ln -s "$CANON/artifacts/agent-runtime"            artifacts/agent-runtime || true
          [ -f "$CANON/artifacts/consumption_ledger.yaml" ] && \
            ln -s "$CANON/artifacts/consumption_ledger.yaml" artifacts/consumption_ledger.yaml || true
          ls -la repos artifacts
      - name: Run tracer test cases
        working-directory: subblock/tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-cases-logs-${{ github.run_id }}
          path: subblock/tracer/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- tracer: end-to-end 10-HF-task smoke (~30 min) -----------------------
  tracer-smoke:
    name: tracer tests (smoke)
    needs: [detect-changes, tracer-cases]
    if: |
      needs.detect-changes.outputs.tracer == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true) ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 55
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/tracer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/tracer"
          mkdir -p repos artifacts
          rm -rf repos/harbor repos/swe_data_process artifacts/env artifacts/agent-runtime artifacts/consumption_ledger.yaml
          ln -s "$CANON/repos/harbor"                       repos/harbor
          ln -s "$CANON/repos/swe_data_process"             repos/swe_data_process
          ln -s "$CANON/artifacts/env"                      artifacts/env
          # agent.runtime_host_path: harbor bind-mounts this into every trial
          # container at /opt/custom-agent-runtime/claude-code. Without the
          # symlink the workspace dir is empty → "Mounted runtime detection
          # failed" → fallback `curl claude.ai/install.sh` → 403 → 0 trajectories.
          [ -d "$CANON/artifacts/agent-runtime" ] && \
            ln -s "$CANON/artifacts/agent-runtime"            artifacts/agent-runtime || true
          [ -f "$CANON/artifacts/consumption_ledger.yaml" ] && \
            ln -s "$CANON/artifacts/consumption_ledger.yaml" artifacts/consumption_ledger.yaml || true
      - name: Overlay smoke config.yaml from subblock/tracer/tests/smoke
        run: cp subblock/tracer/tests/smoke/config.yaml subblock/tracer/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          LITELLM_NUM_WORKERS: "1"
        run: bash .github/scripts/smoke_run.sh tracer 2400
      - name: Verify smoke
        if: always()
        shell: bash {0}    # no -e — let verify.sh exit 77 fall through to the SKIP mapping
        run: |
          bash subblock/tracer/tests/smoke/verify.sh
          rc=$?
          if [[ $rc -eq 77 ]]; then echo "::warning::tracer smoke SKIPped"; exit 0; fi
          exit $rc
      - name: Upload logs
        if: always()
        continue-on-error: true   # harbor's root-owned agent/sessions can survive cleanup → upload EACCES, don't fail the job
        uses: actions/upload-artifact@v4
        with:
          name: tracer-smoke-logs-${{ github.run_id }}
          path: |
            subblock/tracer/artifacts/logs/
            subblock/tracer/artifacts/jobs/smoke/
          if-no-files-found: ignore
          retention-days: 14

  # --- evaluator: cheap test cases ------------------------------------------------
  evaluator-cases:
    name: evaluator tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.evaluator == 'true'
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 30   # cpfs cold-cache uv-env-editable case can take ~7 min
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        # evaluator smokes drop root-owned files in the workspace — Harbor's
        # bind-mounted agent-runtime AND Docker trial containers running as
        # root drop state under artifacts/jobs/smoke/. Any of these makes
        # actions/checkout's workspace-clean fail with EACCES. Run docker
        # (root on the daemon) to chown anything not owned by uid 1000 back to
        # us. Idempotent.
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      # Source-only checkout — submodules + envs come from $SHARED_RUNTIME.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=/gpufs/haoli/cicd/shared/uv/bin:/home/haoli/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link runtime state from /gpufs/.../shared/runtime
        working-directory: subblock/evaluator
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/evaluator"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — run bash /gpufs/haoli/cicd/sync_runtime.sh evaluator"; exit 1; }
          # actions/checkout creates empty placeholder dirs for declared
          # submodules; ln -sfn would put the link INSIDE them. rm -rf first.
          mkdir -p repos artifacts
          rm -rf repos/harbor artifacts/env artifacts/runtime artifacts/index.yaml
          ln -s "$CANON/repos/harbor"        repos/harbor
          ln -s "$CANON/artifacts/env"       artifacts/env
          # agent.runtime_host_path: harbor bind-mounts this into every task
          # container at container_runtime_root. Without the symlink the dir is
          # empty → agent falls back to an in-container install → 403 on
          # isolated networks → zero usable trajectories.
          ln -s "$CANON/artifacts/runtime"   artifacts/runtime
          [ -f "$CANON/artifacts/index.yaml" ] && ln -s "$CANON/artifacts/index.yaml" artifacts/index.yaml \
            || printf 'runs: []\n' > artifacts/index.yaml
          ls -la repos artifacts
      - name: Run evaluator test cases
        working-directory: subblock/evaluator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-cases-logs-${{ github.run_id }}
          path: subblock/evaluator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- evaluator: end-to-end registry-task smoke (~30 min) ------------------------
  evaluator-smoke:
    name: evaluator tests (smoke)
    needs: [detect-changes, evaluator-cases]
    if: |
      needs.detect-changes.outputs.evaluator == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true) ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, swe-lego-ci]
    timeout-minutes: 55
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "find /x -type d -name sessions -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; rm -rf /x/SWE-Lego-Live/subblock/tracer/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/tracer/artifacts/agent-runtime /x/SWE-Lego-Live/subblock/evaluator/artifacts/jobs/smoke /x/SWE-Lego-Live/subblock/evaluator/artifacts/runtime /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/py-cc-smoke /x/SWE-Lego-Live/subblock/curator/artifacts/swe_tasks/.swegen-smoke-py /x/SWE-Lego-Live/subblock/trainer/artifacts/model/_smoke_* 2>/dev/null; find /x ! -user 1000 -exec chown 1000:1000 {} + 2>/dev/null; find /x -type d -exec chmod u+rx {} + 2>/dev/null" || true
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source /gpufs/haoli/cicd/shared/.env
          {
            echo "HOME=$CI_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
