name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      smoke_scope:
        description: "Which smoke to run (real LLM tokens + Docker/GPU)"
        type: choice
        options:
          - none        # cheap cases only
          - blocks   # each block's ISOLATED smoke (~30 min each)
          - root        # the ROOT chained end-to-end smoke (all 4 blocks, hours)
          - all         # blocks + root
        default: none
      root_budget:
        description: "Per-stage budget (sec) for the ROOT chain; blank = config defaults (curator 4h). Set e.g. 1800 for a quick pass."
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# These paths are operator-configured repository variables for self-hosted
# runners. The defaults are neutral examples; production runners should point
# them at their own protected env and runtime mirror.
env:
  CICD_SHARED: ${{ vars.LEGOFLOW_CI_SHARED || '/opt/legoflow-ci/shared' }}
  SHARED_RUNTIME: ${{ vars.LEGOFLOW_SHARED_RUNTIME || '/opt/legoflow-ci/shared/runtime' }}
  LEGOFLOW_CLI_HOME: ${{ vars.LEGOFLOW_CLI_HOME }}

jobs:
  # --- Cheap cloud job: structural sanity of the block tree -------------------
  root-block:
    name: Root block sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --no-cache-dir pytest pyyaml

      - name: Run root block cheap cases (pytest + shell cases)
        # tests/run.sh (no --smoke) runs pytest tests/test_root_block.py AND the
        # tests/cases/*.sh shell cases — all cheap, no network/Docker/GPU. They
        # read the block + tests/smoke config.yaml files present on checkout.
        run: bash tests/run.sh

  # --- Decide which blocks need their CI run -------------------------------
  detect-changes:
    name: Detect changed blocks
    runs-on: ubuntu-latest
    outputs:
      curator: ${{ steps.filter.outputs.curator }}
      tracer: ${{ steps.filter.outputs.tracer }}
      evaluator: ${{ steps.filter.outputs.evaluator }}
      trainer: ${{ steps.filter.outputs.trainer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            curator:
              - 'blocks/curator/**'
              - '.github/workflows/ci.yml'
            tracer:
              - 'blocks/tracer/**'
              - '.github/workflows/ci.yml'
            evaluator:
              - 'blocks/evaluator/**'
              - '.github/workflows/ci.yml'
            trainer:
              - 'blocks/trainer/**'
              - '.github/workflows/ci.yml'

  # --- curator: cheap test cases (self-hosted, fixed-paths CI runner) ---------
  curator-cases:
    name: curator tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.curator == 'true'
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 30   # network-filesystem cold-cache setup can take several minutes
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            t0=$(date +%s)
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "rm -rf /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/agent-runtime /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/runtime /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/py-cc-smoke /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py /x/${GITHUB_REPOSITORY#*/}/blocks/trainer/artifacts/model/_smoke_* 2>/dev/null; for j in /x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/jobs; do [ -d \"\$j\" ] && find \"\$j\" -type d -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; done; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( ! -user 1000 \) -exec chown 1000:1000 {} + 2>/dev/null; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( -type d ! -perm -u+rx \) -exec chmod u+rx {} + 2>/dev/null" || true
            echo "INFO: workspace reclaim took $(( $(date +%s) - t0 ))s"
          fi
      # Source-only checkout — submodules + venvs come from $SHARED_RUNTIME.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$HOME/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link shared runtime state
        working-directory: blocks/curator
        env:
          LEGOFLOW_SUBMODULE_TOKEN: ${{ secrets.LEGOFLOW_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          source "$CICD_SHARED/.env"
          CANON="${SHARED_RUNTIME}/curator"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — rebuild it with $CICD_SHARED/sync_runtime.sh curator"; exit 1; }
          mkdir -p repos artifacts artifacts/swe_tasks
          rm -rf repos/legoflow-curator artifacts/envs artifacts/swe_tasks/py-cc gh_token.txt

          if [ -e "$CANON/repos/legoflow-curator/.git" ]; then
            ln -s "$CANON/repos/legoflow-curator" repos/legoflow-curator
          else
            if [ -n "${GITHUB_TOKENS:-}" ]; then
              export GITHUB_TOKEN="${GITHUB_TOKENS%%,*}"
            elif [ -n "${LEGOFLOW_SUBMODULE_TOKEN:-}" ]; then
              export GITHUB_TOKEN="$LEGOFLOW_SUBMODULE_TOKEN"
            fi
            [ -n "${GITHUB_TOKEN:-}" ] || { echo "ERROR: no private-submodule token configured"; exit 1; }
            GIT_TERMINAL_PROMPT=0 git -C ../.. \
              -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f' \
              submodule update --init --recursive -- blocks/curator/repos/legoflow-curator
          fi

          mkdir -p artifacts/envs
          if [ -x "$CANON/artifacts/envs/legoflow-curator-env/bin/python" ]; then
            ln -s "$CANON/artifacts/envs/legoflow-curator-env" \
              artifacts/envs/legoflow-curator-env
          else
            uv venv artifacts/envs/legoflow-curator-env --python 3.12
            uv pip install --python artifacts/envs/legoflow-curator-env/bin/python \
              -e repos/legoflow-curator
          fi
          [ -f "$CANON/gh_token.txt" ] && ln -s "$CANON/gh_token.txt" gh_token.txt || true
          # Optional Harbor smoke fixture (case 06 SKIPs if absent)
          [ -d "$CANON/artifacts/swe_tasks/py-cc" ] && \
            ln -s "$CANON/artifacts/swe_tasks/py-cc" artifacts/swe_tasks/py-cc || true
          ls -la repos artifacts artifacts/swe_tasks
      - name: Run curator test cases
        env:
          GITHUB_TOKEN: ${{ secrets.LEGOFLOW_SUBMODULE_TOKEN }}
        run: bash .github/scripts/align_submodules.sh
      - name: Run curator test cases
        working-directory: blocks/curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          CURATOR_SKIP_EXTERNAL_PREFLIGHT: "1"
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: curator-cases-logs-${{ github.run_id }}
          path: |
            blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py.log
            blocks/curator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- curator: end-to-end 10-PR smoke (~30 min) ------------------------------
  curator-smoke:
    name: curator tests (smoke)
    needs: [detect-changes, curator-cases]
    # `always()` so a manual smoke_scope dispatch isn't cascade-skipped just
    # because curator-cases was skipped (no path diff vs dev — the normal
    # state right after this branch merges). Still blocks on an actual
    # curator-cases FAILURE; only a SKIP (no diff) is tolerated.
    if: |
      always() && needs.curator-cases.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.smoke_scope == 'blocks' || inputs.smoke_scope == 'all')) ||
        (needs.detect-changes.outputs.curator == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 70
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            t0=$(date +%s)
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "rm -rf /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/agent-runtime /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/runtime /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/py-cc-smoke /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py /x/${GITHUB_REPOSITORY#*/}/blocks/trainer/artifacts/model/_smoke_* 2>/dev/null; for j in /x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/jobs; do [ -d \"\$j\" ] && find \"\$j\" -type d -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; done; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( ! -user 1000 \) -exec chown 1000:1000 {} + 2>/dev/null; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( -type d ! -perm -u+rx \) -exec chmod u+rx {} + 2>/dev/null" || true
            echo "INFO: workspace reclaim took $(( $(date +%s) - t0 ))s"
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$HOME/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link shared runtime state
        working-directory: blocks/curator
        env:
          LEGOFLOW_SUBMODULE_TOKEN: ${{ secrets.LEGOFLOW_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          source "$CICD_SHARED/.env"
          CANON="${SHARED_RUNTIME}/curator"
          mkdir -p repos artifacts
          rm -rf repos/legoflow-curator artifacts/envs gh_token.txt
          if [ -e "$CANON/repos/legoflow-curator/.git" ]; then
            ln -s "$CANON/repos/legoflow-curator" repos/legoflow-curator
          else
            if [ -n "${GITHUB_TOKENS:-}" ]; then
              export GITHUB_TOKEN="${GITHUB_TOKENS%%,*}"
            elif [ -n "${LEGOFLOW_SUBMODULE_TOKEN:-}" ]; then
              export GITHUB_TOKEN="$LEGOFLOW_SUBMODULE_TOKEN"
            fi
            [ -n "${GITHUB_TOKEN:-}" ] || { echo "ERROR: no private-submodule token configured"; exit 1; }
            GIT_TERMINAL_PROMPT=0 git -C ../.. \
              -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f' \
              submodule update --init --recursive -- blocks/curator/repos/legoflow-curator
          fi
          mkdir -p artifacts/envs
          if [ -x "$CANON/artifacts/envs/legoflow-curator-env/bin/python" ]; then
            ln -s "$CANON/artifacts/envs/legoflow-curator-env" \
              artifacts/envs/legoflow-curator-env
          else
            uv venv artifacts/envs/legoflow-curator-env --python 3.12
            uv pip install --python artifacts/envs/legoflow-curator-env/bin/python \
              -e repos/legoflow-curator
          fi
          [ -f "$CANON/gh_token.txt" ] && ln -s "$CANON/gh_token.txt" gh_token.txt || true
      - name: Overlay smoke config.yaml from blocks/curator/tests/smoke
        # The template carries no endpoint/key; inject them from the
        # shared env into the COPY (never back into the template).
        run: |
          set -euo pipefail
          source "$CICD_SHARED/.env"
          cp blocks/curator/tests/smoke/config.yaml blocks/curator/config.yaml
          python3 scripts/inject_smoke_secrets.py blocks/curator/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh curator
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash .github/scripts/smoke_run.sh curator 3600
      - name: Verify smoke
        if: always()
        shell: bash {0}    # no -e — let verify.sh exit 77 fall through to the SKIP mapping
        run: |
          bash blocks/curator/tests/smoke/verify.sh
          rc=$?
          if [[ $rc -eq 77 ]]; then echo "::warning::curator smoke SKIPped"; exit 0; fi
          exit $rc
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-smoke-logs-${{ github.run_id }}
          path: |
            blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py.log
            blocks/curator/artifacts/swe_tasks/py-cc-smoke/verifiable_tasks.txt
            blocks/curator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  # --- tracer: cheap test cases ---------------------------------------------
  tracer-cases:
    name: tracer tests (cases)
    needs: detect-changes
    if: needs.detect-changes.outputs.tracer == 'true'
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 30   # network-filesystem cold-cache setup can take several minutes
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        # Prior tracer smokes drop root-owned files in the workspace —
        # Harbor's bind-mounted agent-runtime AND Docker trial containers
        # running as root drop sessions/state under jobs/smoke/. Any of
        # these makes actions/checkout's workspace-clean fail with EACCES.
        # Run docker (which IS root on the daemon) to chown anything in the
        # workspace not owned by uid 1000 back to us. Idempotent.
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            t0=$(date +%s)
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "rm -rf /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/agent-runtime /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/runtime /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/py-cc-smoke /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py /x/${GITHUB_REPOSITORY#*/}/blocks/trainer/artifacts/model/_smoke_* 2>/dev/null; for j in /x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/jobs; do [ -d \"\$j\" ] && find \"\$j\" -type d -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; done; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( ! -user 1000 \) -exec chown 1000:1000 {} + 2>/dev/null; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( -type d ! -perm -u+rx \) -exec chmod u+rx {} + 2>/dev/null" || true
            echo "INFO: workspace reclaim took $(( $(date +%s) - t0 ))s"
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$HOME/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link shared runtime state
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/tracer"
          [ -d "$CANON" ] || { echo "ERROR: $CANON not found — rebuild it with $CICD_SHARED/sync_runtime.sh tracer"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/remove_workspace_paths.sh" \
            blocks/tracer/repos/harbor blocks/tracer/repos/swe_data_process \
            blocks/tracer/artifacts/env blocks/tracer/artifacts/agent-runtime \
            blocks/tracer/artifacts/processed_tasks.yaml
          mkdir -p repos artifacts
          ln -s "$CANON/repos/harbor"                       repos/harbor
          ln -s "$CANON/repos/swe_data_process"             repos/swe_data_process
          ln -s "$CANON/artifacts/env"                      artifacts/env
          # agent.runtime_host_path: harbor bind-mounts this into every trial
          # container at /opt/custom-agent-runtime/claude-code. Without the
          # symlink the workspace dir is empty → "Mounted runtime detection
          # failed" → fallback `curl claude.ai/install.sh` → 403 → 0 trajectories.
          [ -d "$CANON/artifacts/agent-runtime" ] && \
            ln -s "$CANON/artifacts/agent-runtime"            artifacts/agent-runtime || true
          # dryrun.sh FAILs outright without the ledger, and it is gitignored
          # runtime state, so a runner whose canonical copy lacks it could never
          # get past preflight. Link it when present, otherwise start an empty one.
          if [ -f "$CANON/artifacts/processed_tasks.yaml" ]; then
            ln -s "$CANON/artifacts/processed_tasks.yaml" artifacts/processed_tasks.yaml
          else
            printf 'description: %s\nruns: []\n' 'Tracer task processed-tasks ledger' \
              > artifacts/processed_tasks.yaml
          fi
          ls -la repos artifacts
      - name: Run tracer test cases
        env:
          GITHUB_TOKEN: ${{ secrets.LEGOFLOW_SUBMODULE_TOKEN }}
        run: bash .github/scripts/align_submodules.sh
      - name: Refresh tracer editable environments
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          bash scripts/setup_harbor_env.sh
          bash scripts/setup_swe_data_process_env.sh
      - name: Run tracer test cases
        working-directory: blocks/tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bash tests/run.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-cases-logs-${{ github.run_id }}
          path: blocks/tracer/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- tracer: end-to-end 10-HF-task smoke (~30 min) -----------------------
  tracer-smoke:
    name: tracer tests (smoke)
    needs: [detect-changes, tracer-cases]
    # `always()` so a manual smoke_scope dispatch isn't cascade-skipped just
    # because tracer-cases was skipped (no path diff vs dev — the normal
    # state right after this branch merges). Still blocks on an actual
    # tracer-cases FAILURE; only a SKIP (no diff) is tolerated.
    if: |
      always() && needs.tracer-cases.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.smoke_scope == 'blocks' || inputs.smoke_scope == 'all')) ||
        (needs.detect-changes.outputs.tracer == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      )
    runs-on: [self-hosted, legoflow-ci]
    timeout-minutes: 55
    steps:
      - name: Pre-checkout — reclaim root-owned residue from prior runs
        run: |
          if [ -d "$RUNNER_WORKSPACE" ]; then
            t0=$(date +%s)
            docker run --rm -v "$RUNNER_WORKSPACE:/x:rw" alpine:3 \
              sh -c "rm -rf /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/tracer/artifacts/agent-runtime /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/jobs/smoke /x/${GITHUB_REPOSITORY#*/}/blocks/evaluator/artifacts/runtime /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/py-cc-smoke /x/${GITHUB_REPOSITORY#*/}/blocks/curator/artifacts/swe_tasks/.legoflow-curator-smoke-py /x/${GITHUB_REPOSITORY#*/}/blocks/trainer/artifacts/model/_smoke_* 2>/dev/null; for j in /x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/jobs; do [ -d \"\$j\" ] && find \"\$j\" -type d -path '*agent/sessions' -exec rm -rf {} + 2>/dev/null; done; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( ! -user 1000 \) -exec chown 1000:1000 {} + 2>/dev/null; find /x \( -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/repos' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/env' -o -path '/x/${GITHUB_REPOSITORY#*/}/blocks/*/artifacts/envs' \) -prune -o \( -type d ! -perm -u+rx \) -exec chmod u+rx {} + 2>/dev/null" || true
            echo "INFO: workspace reclaim took $(( $(date +%s) - t0 ))s"
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false   # pre-checkout step handles residue; default `clean: true` triggers destructive recreate on EACCES from harbor docker leftovers
      - name: Isolate HOME + load shared CI env
        run: |
          set -euo pipefail
          CI_HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$CI_HOME"
          # shellcheck disable=SC1091
          source "$CICD_SHARED/.env"
          {
            echo "HOME=$CI_HOME"
            echo "HF_TOKEN=$HF_TOKEN"
            echo "HUGGING_FACE_HUB_TOKEN=$HUGGING_FACE_HUB_TOKEN"
            echo "HF_HOME=$HF_HOME"
            echo "PIP_CACHE_DIR=$PIP_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "PATH=$CICD_SHARED/uv/bin:$HOME/.local/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Link shared runtime state
        working-directory: blocks/tracer
        run: |
          set -euo pipefail
          CANON="${SHARED_RUNTIME}/tracer"
          bash "$GITHUB_WORKSPACE/.github/scripts/remove_workspace_paths.sh" \
            blocks/tracer/repos/harbor blocks/tracer/repos/swe_data_process \
            blocks/tracer/artifacts/env blocks/tracer/artifacts/agent-runtime \
            blocks/tracer/artifacts/processed_tasks.yaml
          mkdir -p repos artifacts
          ln -s "$CANON/repos/harbor"                       repos/harbor
          ln -s "$CANON/repos/swe_data_process"             repos/swe_data_process
          ln -s "$CANON/artifacts/env"                      artifacts/env
          # agent.runtime_host_path: harbor bind-mounts this into every trial
          # container at /opt/custom-agent-runtime/claude-code. Without the
          # symlink the workspace dir is empty → "Mounted runtime detection
          # failed" → fallback `curl claude.ai/install.sh` → 403 → 0 trajectories.
          [ -d "$CANON/artifacts/agent-runtime" ] && \
            ln -s "$CANON/artifacts/agent-runtime"            artifacts/agent-runtime || true
          # dryrun.sh FAILs outright without the ledger, and it is gitignored
          # runtime state, so a runner whose canonical copy lacks it could never
          # get past preflight. Link it when present, otherwise start an empty one.
          if [ -f "$CANON/artifacts/processed_tasks.yaml" ]; then
            ln -s "$CANON/artifacts/processed_tasks.yaml" artifacts/processed_tasks.yaml
          else
            printf 'description: %s\nruns: []\n' 'Tracer task processed-tasks ledger' \
              > artifacts/processed_tasks.yaml
          fi
      - name: Overlay smoke config.yaml from blocks/tracer/tests/smoke
        # The template carries no endpoint/key; inject them from the
        # shared env into the COPY (never back into the template).
        run: |
          set -euo pipefail
          source "$CICD_SHARED/.env"
          cp blocks/tracer/tests/smoke/config.yaml blocks/tracer/config.yaml
          python3 scripts/inject_smoke_secrets.py blocks/tracer/config.yaml
      - name: Run smoke via .github/scripts/smoke_run.sh tracer
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          LITELLM_NUM_WORKERS: "1"
        run: bash .github/scripts/smoke_run.sh tracer 2400
      - name: Verify smoke
        if: always()
        shell: bash {0}    # no -e — let verify.sh exit 77 fall through to the SKIP mapping
        run: |
          bash blocks/tracer/tests/smoke/verify.sh
          rc=$?
          if [[ $rc -eq 77 ]]; then echo "::warning::tracer smoke SKIPped"; exit 0; fi
          exit $rc
      - name: Upload logs
        if: always()
        continue-on-error: true   # harbor's root-owned agent/sessions can survive cleanup → upload EACCES, don't fail the job
        uses: actions/upload-artifact@v4
        with:
