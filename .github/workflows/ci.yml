        uses: actions/upload-artifact@v4
        with:
          name: evaluator-cases-logs-${{ github.run_id }}
          path: subblock/evaluator/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  # --- evaluator: end-to-end registry-task smoke (~40 min) ------------------------
  evaluator-smoke:
    name: evaluator tests (smoke)
    needs: [detect-changes, evaluator-cases]
    # `always()` so a manual smoke_scope dispatch isn't cascade-skipped just
    # because evaluator-cases was skipped (no path diff vs dev — the normal
