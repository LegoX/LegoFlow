meta_info:
  name: trainer
  label: "Trainer"
  description: Trainer block — SFT training pipeline for SWE-bench coding models. Converts raw agent trajectories from multiple scaffolds into LLaMA-Factory sharegpt format, then trains models via LLaMA-Factory + DeepSpeed (ZeRO-3).
  parent: legoflow
  blocks: {}
  dependencies:
    from:
      source.job_dir:
        from: tracer.output.raw_trajectories_dir
        when: {source.type: harbor_job}
    to: {}   # nothing currently declares a dependency on trainer's outputs

  resources:
    ip: local
    pwd: null
    directory: null
    public_storage: null

  repositories:
    llama_factory:
      url: https://github.com/LegoX/LLaMA-Factory.git
      branch: main
      commit: 6e23fa19f485d86d0e5666ce3a9fdfdebb43c050
      path: repos/LLaMA-Factory
      readonly: true
    legoflow_trace_crafter:
      url: https://github.com/LegoX/LegoFlow-Trace-Crafter.git
      branch: main
      commit: 5e9575a63f59b704c98776399a9502443918e356
      path: repos/LegoFlow-Trace-Crafter
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/LegoFlow-Trace-Crafter

runtime_info:
  input: 
    source:
      type: hf_lf                 # harbor_job | hf_lf | local_lf
      scaffold: openhands-sdk     # harbor_job only: openhands-sdk | claude-code | open-code | terminus2
      job_dir: ../tracer/artifacts/jobs/<job>  # harbor_job only: replace <job> with a real Tracer job
      hf_hub_url: "Lego-X/samples_for_llama_factory_sft"
      hf_file_name: "jierun_glm52_openswe_mirror_score4_proto_oh_sdk_512_for_qwen3_5.json"  # empty = full dataset config
      hf_subset: ""               # ignored when hf_file_name is set
      hf_split: "train"
      lf_path: ../tracer/artifacts/sft_data/<job>/lf.json  # local_lf only: replace <job> with a converted Tracer job

    conversion:                   # harbor_job only; for hf_lf/local_lf just data_name + max_instances apply
      max_instances: 0            # 0 = all samples; >0 = random subsample via num_samples
      exclude_repos_file: scripts/excluded_repos.txt
      data_name: "glm52_openswe_mirror_score4_proto_oh_sdk_512_qwen3_5"

    dataset:
      name: ""                    # auto-derived from conversion.data_name

    model:
      model_name_or_path: Qwen/Qwen3.5-35B-A3B-Base
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: scripts/deepspeed/ds_z3_config.json
      template: qwen3_5
      cutoff_len: 131072
      rope_scaling: null          # Qwen3.5 supports 128K natively
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      output_dir: "qwen3_5_35b_a3b_base_glm52_openswe_mirror_score4_proto_oh_sdk_512_gbs64pbs1acc8_lr5e-5_epo3"
      logging_steps: 1
      save_strategy: steps
      save_steps: 200
      overwrite_output_dir: false # explicit env override required to replace an existing run
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-5
      weight_decay: 0.01
      max_grad_norm: 1.0
      num_train_epochs: 3.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: sdpa

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""                # "" = auto-derived
      wandb_mode: offline
      wandb_run_id: ""            # "" = auto-assigned

    credentials:
      wandb_api_key: ""           # via $WANDB_API_KEY
      hf_token: ""                # via $HF_TOKEN; needed only for private hf_lf datasets

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: null
    artifacts:
      train_results: null
      train_loss_plot: null
      training_log: null
    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null
    training_metrics:
      description: Final training metrics from LLaMA-Factory
      value: null
