meta_info:
  name: evaluator
  label: Evaluator
  description: Runs registered benchmark evaluations through Harbor against a configurable
    upstream LLM. Mirrors tracer's runtime shell, but loads tasks from Harbor's registry.json
    instead of a local curator export.
  parent: legoflow
  blocks: {}
  dependencies:
    from: {}
    to: {}
  resources:
    ip: local
    user: null
    pwd: null
    directory: .
    description: Local execution; set host-specific values in your private run profile
    public_storage: ./artifacts
  repositories:
    harbor:
      url: https://github.com/LegoX/harbor.git
      branch: main
      commit: 348d10f175e7951fcd1cbf472eb454d3d0a9b667
      path: repos/harbor
      readonly: true
  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv
    litellm:
      python_version: '3.13'
      litellm_version: 1.83.14
runtime_info:
  input:
    llm_api:
      api_key: ''
      api_base_url: ''
      model: openai/gpt-5.4-nano
      description: Example local checkpoint served via vLLM; see scripts/serve_local_model.sh.
      protocols:
      - openai_compatible
      - anthropic_compatible
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    local_model_serving:
      model_path: artifacts/models/Qwen3.5-35B-A3B
      model_name: Qwen3.5-35B-A3B
    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4104
      master_key: dummy-key-cf
    task_source:
      provider: harbor_registry
      dataset_name: swebench-verified
      version: '1.0'
      registry_path: repos/harbor/registry.json
      no_hack: true
    harbor_job:
      jobs_dir: artifacts/jobs
      n_concurrent: 24
      n_tasks: null
      max_retries: 2
      timeout_multiplier: 1
    job_analysis:
      enabled: true
      tag_llm:
        base_url: ''
        model: ''
        api_key: ''
    agent:
      name: custom-openhands-sdk
      orchestration_runtime: claude_code
      version: 1.33.0
      runtime_image: docker.io/jierun/c-oh-sdk-1.33.0:v0.1
      runtime_host_path: artifacts/runtime/openhands-sdk
      max_turns: 200
      temperature: 1.0
    env_extra:
      HARBOR_EXCLUDE_TASKS: ''
      LITELLM_STICKY_ROUTING_ALIASES: ''
  output:
    eval_results_dir:
      description: Harbor job directories containing per-task evaluation results and
        LiteLLM trajectory logs
      path: artifacts/jobs
      job_layout: artifacts/jobs/<job>/<task>/{agent,verifier}/
      trajectory_format: artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl
      results_summary_format: artifacts/jobs/<job>/result.json
