<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegoFlow-Evaluator</title>
    <link rel="stylesheet" href="/styles.css?v=22" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="app" class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-mark">Eval</div>
          <div>
            <div class="logo-title">LegoFlow-Eval</div>
            <div class="logo-sub">Dashboard</div>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-section">
          <div id="jobs-section-label" class="section-label">Jobs</div>
          <input id="job-filter" class="filter-input" placeholder="Filter jobs…" />
          <div id="job-list" class="job-list"></div>
        </div>
        <div class="sidebar-footer">
          <div class="row">
            <span id="compare-label" class="muted">Compare</span>
            <span id="compare-count" class="badge">0</span>
          </div>
          <button id="open-compare" class="btn-mini">Open compare</button>
          <button id="clear-compare" class="btn-mini ghost">Clear</button>
          <div id="compare-help" class="muted small compare-help">Use the + button next to a job to add it to Compare.</div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs" id="crumbs"></div>
          <div class="top-actions">
            <span id="status" class="muted small"></span>
            <div class="info-wrap">
              <button id="info-toggle" class="icon-btn" title="What this board is reading" aria-label="Dashboard info">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5"></path><path d="M12 8h.01"></path></svg>
              </button>
              <div class="info-panel" id="info-panel" hidden></div>
            </div>
            <button id="lang-toggle" class="icon-btn text" title="Switch language">中</button>
            <button id="reload" class="icon-btn" title="Reload">↻</button>
            <button id="theme-toggle" class="icon-btn" title="Toggle theme">☀</button>
          </div>
        </header>
        <section id="content" class="content"></section>
      </main>
    </div>
    <script src="/app.js?v=22"></script>
  </body>
</html>
