# SMOKE CI CONFIG — copied over blocks/evaluator/config.yaml by
# .github/workflows/ci.yml before invoking `claude -p "/evaluator:run"`.
# The checked-in fixture is infrastructure-neutral. Configure a reachable LLM
# endpoint in a private copy before running the end-to-end smoke.
meta_info:
  name: evaluator
  label: "Evaluator"
  description: Runs registered benchmark evaluations through Harbor against a configurable upstream LLM.
  parent: legoflow
  blocks: {}
  dependencies:
    from: {}
    to: {}

  resources:
    ip: local
    user: null
    pwd: null
    directory: .
    description: local smoke execution
    public_storage: ./artifacts

  repositories:
    harbor:
      url: https://github.com/LegoX/harbor.git
      branch: main
      commit: 348d10f175e7951fcd1cbf472eb454d3d0a9b667
      path: repos/harbor
      readonly: true

  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv
    litellm:
      python_version: "3.13"
      litellm_version: "1.83.14"

runtime_info:
  input:
    llm_api:
      # Blank on purpose: scripts/inject_smoke_secrets.py fills a field only
      # when it is "", from SMOKE_EVALUATOR_LLM_* falling back to SMOKE_LLM_*.
      # A non-empty placeholder here is never replaced, which is how this smoke
      # ended up pointing at a vLLM nobody starts.
      api_key: ""
      api_base_url: ""
      model: ""
      description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      protocols: [openai_compatible, anthropic_compatible]
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4102                          # SMOKE: isolate from production 4101
      master_key: dummy-key-cf

    task_source:
      provider: harbor_registry
      dataset_name: swebench-verified   # SMOKE: full benchmark; harbor_job.n_tasks caps it to 10
      version: "1.0"
      registry_path: repos/harbor/registry.json
      no_hack: false                    # SMOKE: keep ordinary registry path

    harbor_job:
      jobs_dir: artifacts/jobs/smoke    # SMOKE: was artifacts/jobs
      n_concurrent: 5                   # SMOKE: production uses 4
      n_tasks: 10                       # SMOKE: was null (full 500)
      max_retries: 0                    # SMOKE: was 2
      timeout_multiplier: 1

    job_analysis:
      enabled: false                    # SMOKE: rollout gate only; skip post-hoc reports

    agent:
      name: custom-openhands-sdk
      version: 1.33.0
      runtime_image: docker.io/jierun/c-oh-sdk-1.33.0:v0.1
      runtime_host_path: artifacts/runtime/openhands-sdk
      max_turns: 50                     # SMOKE: was 200
      temperature: 1.0

    env_extra:
      HARBOR_EXCLUDE_TASKS: ""
      LITELLM_STICKY_ROUTING_ALIASES: ""
      # SMOKE: force a single uvicorn worker (skip gunicorn's 30s boot timeout).
      LITELLM_NUM_WORKERS: "1"

  output:
    eval_results_dir:
      description: Harbor job directories containing per-task evaluation results and LiteLLM trajectory logs
      path: artifacts/jobs/smoke
      job_layout: "artifacts/jobs/smoke/<job>/<task>/{agent,verifier}/"
      trajectory_format: "artifacts/jobs/smoke/<job>/<task>/agent/litellm-trajectory.jsonl"
      results_summary_format: "artifacts/jobs/smoke/<job>/result.json"
