meta_info:
  name: tracer
  label: "Tracer"
  description: Generates raw agent trajectories with Harbor for downstream SFT data conversion.
  parent: legoflow
  blocks: {}
  dependencies:
    from:
      task_source.dataset_name:
        from: curator.output.merged_tasks_dir
        when: {task_source.provider: local, task_source.local_block: curator}
      task_source.terminal_tasks_dir:
        from: terminal-curator.output.harbor_tasks_dir
        when: {task_source.provider: local, task_source.local_block: terminal-curator}

      task_source.stratified_dataset_dir:
        from: curator.output.stratified_tasks_dir
        when: {task_source.pool: stratified}
    to:
      raw_trajectories_dir:
        to: trainer.input.source.job_dir
        when: {trainer.input.source.type: harbor_job}

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: null
    pwd: null
    directory: null
    description: Local CPU/Docker node. Remote SSH fields are ignored when ip is local.
    public_storage: null

  repositories:
    harbor:
      url: https://github.com/LegoX/harbor.git
      branch: main
      commit: 73fd120e731217b38f31667932ea26a28cdd4fff
      path: repos/harbor
      readonly: true
    legoflow_trace_crafter:
      url: https://github.com/LegoX/LegoFlow-Trace-Crafter.git
      branch: main
      commit: 5e9575a63f59b704c98776399a9502443918e356   # origin/main HEAD (LegoFlow-Trace-Crafter rename)
      path: repos/LegoFlow-Trace-Crafter
      readonly: true

  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv    # separate venv; harbor env resets to litellm 1.83.0
    legoflow_trace_crafter_uv: artifacts/env/legoflow-trace-crafter-uv
    legoflow_trace_crafter_extras: [llm]
    litellm:
      python_version: "3.13"
      litellm_version: "1.83.14"

runtime_info:
  input:
    llm_api:
      api_key: ""                             # supplied by OPENAI_API_KEY; never commit a real key
      api_base_url: ""                        # supplied by OPENAI_API_BASE_URL
      model: "openai/Qwen3.6-35B-A3B"
      description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      protocols: [openai_compatible, anthropic_compatible]
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4003
      master_key: legoflow-local-proxy-key

    task_source:
      provider: local                  # local | huggingface
      local_block: curator             # curator | terminal-curator | external (used only for local)
      dataset_name: ../curator/artifacts/merged_swe_tasks
      terminal_tasks_dir: ../terminal-curator/artifacts/tasks
      split: train
      pool: merged                     # merged (whole merged pool) | stratified (curator's stratified sub-pool)
      stratified_dataset_dir: ../curator/artifacts/stratified_swe_tasks  # used only when pool: stratified; default mirrors curator.output.stratified_tasks_dir (generated by curator's scripts/select_stratified_tasks.py)

    harbor_job:
      jobs_dir: artifacts/jobs         # exported by start.sh as TRAJGEN_HARBOR_JOBS_DIR
      n_concurrent: 8
      n_tasks: 40                      # null = all manifest tasks
      max_retries: 2
      timeout_multiplier: 5
      samples_per_task: 1              # >=2 = best-of-n campaign: that many sequential sample jobs re-run every
                                       # staged task (cost multiplies linearly); ledger exclusion is suppressed so
                                       # every sample re-runs; scripts/select_trajectories.py picks winners after

    agent:
      name: custom-claude-code   # Supported pinned versions: custom-claude-code=2.1.118, custom-opencode=1.18.7, custom-openhands-sdk=1.33.0.
      version: 2.1.118
      runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      runtime_host_path: artifacts/agent-runtime/claude-code   # pre-extracted; see /tracer:check reference
      max_turns: 80
      temperature: 0.7
      # Multi-scaffold campaign (opt-in; null = single-agent mode using the four
      # identity fields above, byte-identical to the pre-campaign behavior).
      # When set, start.sh validates every entry (known name, all fields
      # non-empty, no duplicate names), then runs one SEQUENTIAL Harbor job per
      # scaffold over the same staged batch — HARBOR_LEDGER_EXCLUDE is forced to
      # 0 for every scaffold job so each scaffold re-runs the whole batch
      # (excluded_tasks.txt is still honored); job names stay distinct via
      # name+version; each job is converted with its matching --scaffold; then
      # scripts/merge_sft_data.py concatenates the per-scaffold lf.json files
      # into the campaign dataset. max_turns/temperature above stay GLOBAL for
      # every scaffold. Supported entries:
      # scaffolds:
      #   - name: custom-claude-code
      #     version: 2.1.118
      #     runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      #     runtime_host_path: artifacts/agent-runtime/claude-code
      #   - name: custom-opencode
      #     version: 1.18.7
      #     runtime_image: docker.io/jierun/c-oc-1.18.7:v0.1
      #     runtime_host_path: artifacts/agent-runtime/opencode
      #   - name: custom-openhands-sdk
      #     version: 1.33.0
      #     runtime_image: docker.io/jierun/c-oh-sdk-1.33.0:v0.1
      #     runtime_host_path: artifacts/agent-runtime/openhands-sdk
      scaffolds: null

    sft_conversion:
      enabled: true                    # true = start.sh runs convert step after the Harbor job
      scaffold: auto                   # auto derives from agent.name; explicit choices: claude_code | open_code | openhands_sdk | terminus2
      tokenizer_name: Qwen/Qwen3.5-35B-A3B-Base  # align conversion with trainer.model.model_name_or_path
      out_dir: artifacts/sft_data
      max_instances: null
      exclude_repos_file: ""           # "" = repo default artifacts/excluded_repos.txt
      reasoning_check_mode: adaptive
      reasoning_content_ratio_threshold: 0.2

    env_extra:
      HARBOR_EXCLUDE_TASKS: excluded_tasks.txt artifacts/processed_tasks.yaml   # exclusion sources; literal ids also accepted; per-sample TRAJGEN_JOB_NAME / TRAJGEN_JOB_DIR / TRAJGEN_TRAJECTORY_FILE_PATTERN / TRAJGEN_LITELLM_CONFIG are overridden by start.sh

  output:
    raw_trajectories_dir:
      description: Harbor job directories with LiteLLM trajectory logs
      path: artifacts/jobs
      trajectory_format: "artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl"
    sft_data_dir:
      description: LF-format JSON arrays converted from Harbor trajectories, ready for LLaMA-Factory SFT.
      path: artifacts/sft_data
      format: llamafactory_lf_v0.1
      trajectory_format: "artifacts/sft_data/<job>/lf.json"
