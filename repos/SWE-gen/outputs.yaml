description: "How to locate and extract verified SWE tasks from artifacts"

verified_tasks:
  pattern: "artifacts/swe_tasks/{lang}-cc/verifiable_tasks.txt"
  languages: [py, js, ts, go, c, cpp, java, rust]
  format: "One task_id per line, corresponding to a subdirectory in the same folder"
  example: "ansible__ansible-85652"

merged_output:
  path: "outputs/"
  description: "All verified tasks from all languages, merged into one flat directory"

extract_command: "python extract_verified_tasks.py"
extract_behavior:
  - "Reads verifiable_tasks.txt from each language directory under artifacts/swe_tasks/"
  - "Copies each verified task directory to outputs/{task_id}/"
  - "Prints per-language and total statistics"

task_structure:
  description: "Each task directory contains:"
  files:
    - "task.toml        # Metadata: difficulty score, category, timeout"
    - "instruction.md   # Natural language task description for the agent"
    - "environment/Dockerfile  # Docker build environment"
    - "environment/bug.patch   # Patch that introduces the bug"
    - "solution/fix.patch      # Patch that fixes the bug"
    - "solution/solve.sh       # Script to apply fix.patch"
    - "tests/test.sh           # Test execution script"
