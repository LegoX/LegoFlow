# ROOT SMOKE — stage 3/4: sft.
# Overlaid onto subblock/sft/config.yaml by tests/smoke/run_pipeline.sh.
# Schema-compatible with production sft; deltas tagged "# ROOT:".
#
# Trains on the 512-sample smoke fixture COMBINED with the reward==1 LF data
# trajgen (stage 2) just produced, then PERSISTS the resulting checkpoint so
# eval (stage 4) can serve it.
#
# source.type "combined_lf" is a chain-level logical type: run_pipeline.sh
# merges `source.fixture_lf` (the 512 fixture) with every `lf.json` under
# `source.upstream_lf_dir` (trajgen's sft_data) into one LF json, then lowers
# the overlay to the sft block's native source.type=local_lf (lf_path=<merged>)
# before launch — so no sft code change is needed.
#
# Runs on the remote GPU pod (meta_info.resources.ip). That same pod hosts the
# vLLM server eval points at — see tests/smoke/serve_checkpoint.sh.

meta_info:
  name: sft
  label: "SFT Training"
  description: SFT on the 512 fixture + trajgen reward==1 trajectories; persists a checkpoint for eval.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    # ROOT: consume the CONVERTED reward==1 LF (not raw trajectories).
    training_data: trajgen.output.sft_data_dir

  resources:
    ip: 47.79.124.13
    user: root
    pwd: null
    key: /home/haoli/.ssh/dym_id_rsa
    port: 30977
    directory: /mnt/public/storage/haoli/code/SWE-Lego-Live

  repositories:
    llama_factory:
      url: https://github.com/hiyouga/LLaMA-Factory.git
      branch: null
      commit: e695fdfa7092fc39e474fb47be4de82b87160a8e
      path: repos/LLaMA-Factory
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: swe-lego-live
      commit: 8f60ee31bc6c0caf36d1fca88b16bb1e024b9c7e
      path: repos/swe_data_process
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/swe_data_process

runtime_info:
  input:
    source:
      # ROOT: logical combined source — run_pipeline.sh lowers this to local_lf
      # against the merged json before launch (see header).
      type: combined_lf
      scaffold: openhands-sdk
      job_dir: ""
      # The 512-sample fixture (seed via subblock/sft/tests/smoke/prepare_smoke_data.sh).
      fixture_lf: artifacts/data/examples/lf_512.json
      # trajgen's reward==1 SFT data dir (relative to the sft block dir; the
      # orchestrator rewrites to the absolute upstream path at launch).
      upstream_lf_dir: ../trajgen/artifacts/sft_data
      # Filled in by run_pipeline.sh after the merge:
      lf_path: ""

    conversion:
      max_instances: 0
      exclude_repos_file: artifacts/data/excluded_repos.txt
      data_name: "root_smoke_combined"

    dataset:
      name: ""                          # auto-derived from conversion.data_name

    model:
      model_name_or_path: /mnt/public/models/Qwen3-8B
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
      template: qwen3_nothink
      cutoff_len: 131072
      rope_scaling: yarn
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      # ROOT: PERSISTED run dir (NOT a throwaway _smoke_* dir). eval serves this
      # checkpoint; run_pipeline.sh/verify.sh must NOT delete it until eval done.
      output_dir: "root_smoke_model"
      logging_steps: 1
      # ROOT: 'no' still writes ONE final consolidated model into output_dir at
      # the end (what eval serves); it only suppresses the multiplicative
      # intermediate checkpoint-*/global_step* dirs.
      save_strategy: "no"
      save_steps: 200
      overwrite_output_dir: true
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 1.0e-4
      weight_decay: 0.01
      max_grad_norm: 1.0
      # ROOT: more steps than the subblock smoke (4) so the served model is at
      # least lightly trained. This smoke validates the CHAIN, not model quality;
      # bump for a quality-representative run.
      max_steps: 50
      num_train_epochs: 1.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.03
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: disabled
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""
      hf_token: ""

  output:
    checkpoint_path:
      description: Path to the trained model checkpoint (consumed by eval stage 4)
      value: null
    artifacts:
      train_results: null
      train_loss_plot: null
      training_log: null
    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null
    training_metrics:
      description: Final training metrics from LLaMA-Factory
      value: null

evolving:
  description: SFT training pipeline with tunable hyperparameters.
  tunable_params:
    learning_rate: "Learning rate (1e-5 to 1e-3)"
    num_train_epochs: "Number of training epochs"
    per_device_train_batch_size: "Batch size per GPU"
    gradient_accumulation_steps: "Gradient accumulation steps"
    max_instances: "Maximum training instances"
