meta_info:
  name: trainer
  label: "Trainer"
  description: Trainer block — SFT training pipeline for SWE-bench coding models. Converts raw agent trajectories from multiple scaffolds into LLaMA-Factory sharegpt format, then trains models via LLaMA-Factory + DeepSpeed (ZeRO-3).
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    trajectories_dir: tracer.output.raw_trajectories_dir  # path: subblock/tracer/artifacts/jobs

  resources:
    ip: null
    pwd: null
    directory: null
    public_storage: null

  repositories:
    llama_factory:
      url: https://github.com/SWE-Lego/LLaMA-Factory.git
      branch: main
      commit: 3e32f8ca86a71b94d79d1cd51ad457900ec1dc20
      path: repos/LLaMA-Factory
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: main
      commit: 67aadd1e029c6e9a4b3c4b18bfc68557edb6d3c5
      path: repos/swe_data_process
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/swe_data_process

runtime_info:
  input:
    source:
      type: hf_lf                 # choices: harbor_job | hf_lf | local_lf
      # --- harbor_job: convert raw Harbor trajectories into LF data (default; unused while type=hf_lf) ---
      scaffold: openhands-sdk     # choices: openhands-sdk | claude-code | open-code | terminus2
      job_dir: ""                 # set a Harbor job dir here when type=harbor_job
      # --- hf_lf: load a ready-made LF/ShareGPT dataset from the HuggingFace Hub (skips conversion) ---
      hf_hub_url: "SWE-Lego/samples_for_llama_factory_sft"
      hf_file_name: "jierun_glm52_openswe_mirror_score4_proto_oh_sdk_512_for_qwen3_5.json"  # optional exact repo file; empty loads the full dataset config
      hf_subset: ""              # optional dataset config/subset name; ignored when hf_file_name is set
      hf_split: "train"          # optional split (default: train); exact files are registered as train
      # --- local_lf: use an existing local LF/ShareGPT json (skips conversion) ---
      lf_path: ""                # absolute or block-relative path to an LF json

    conversion:
      # Only used when source.type == harbor_job. For hf_lf / local_lf, conversion
      # is skipped; data_name is still used as the registered dataset key, and
      # max_instances (if > 0) becomes the dataset's num_samples (random subsample).
      max_instances: 0            # 0 = use all 512 samples (>0 would random-subsample via num_samples)
      exclude_repos_file: artifacts/data/excluded_repos.txt
      data_name: "glm52_openswe_mirror_score4_proto_oh_sdk_512_qwen3_5"

    dataset:
      name: ""                      # auto-derived from conversion.data_name

    model:
      model_name_or_path: Qwen/Qwen3.5-35B-A3B-Base
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
      template: qwen3_5
      cutoff_len: 131072
      rope_scaling: null            # Qwen3.5 already supports this 128K cutoff natively
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      output_dir: "qwen3_5_35b_a3b_base_glm52_openswe_mirror_score4_proto_oh_sdk_512_gbs64pbs1acc8_lr5e-5_epo3"
      logging_steps: 1
      save_strategy: steps
      save_steps: 200
      overwrite_output_dir: false   # use a new output_dir; explicit env override required to replace an existing run
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-5
      weight_decay: 0.01
      max_grad_norm: 1.0
      num_train_epochs: 3.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: offline
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""
      hf_token: ""                  # HuggingFace token, required only for private source.type=hf_lf datasets

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: null
    artifacts:
      train_results: null
      train_loss_plot: null
      training_log: null
    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null
    training_metrics:
      description: Final training metrics from LLaMA-Factory
      value: null
evolving:
  description: SFT training pipeline with tunable hyperparameters for learning rate, batch size, epochs, and model architecture.
  tunable_params:
    learning_rate: "Learning rate (1e-5 to 1e-3)"
    num_train_epochs: "Number of training epochs"
    per_device_train_batch_size: "Batch size per GPU"
    gradient_accumulation_steps: "Gradient accumulation steps"
    max_instances: "Maximum training instances"
