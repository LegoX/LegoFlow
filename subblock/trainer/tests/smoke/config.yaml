# SMOKE CI CONFIG — copied over subblock/trainer/config.yaml by
# .github/workflows/ci.yml before invoking `claude -p "/trainer:run"`.
# Production config lives at subblock/trainer/config.yaml on dev.
# Delta from production is documented in comments tagged "# SMOKE:".
#
# The smoke trains the production pipeline (DeepSpeed ZeRO-3, 8x GPU, cutoff
# 128K) on the staged 512-sample local_lf snapshot, capped at max_steps=4 with
# save_strategy=no — so the run finishes in minutes and writes no checkpoints
# but exercises every production code path (dataset registration, train YAML
# generation, torchrun, runtime_info.output write).
meta_info:
  name: trainer
  label: "Trainer"
  description: Trainer block — SFT training pipeline for SWE-bench coding models.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    trajectories_dir: tracer.output.raw_trajectories_dir

  resources:
    ip: 47.79.124.13
    user: root                   # remote pod accepts only the root user with this key
    pwd: null
    key: /home/haoli/.ssh/dym_id_rsa
    port: 30977
    directory: /mnt/public/storage/haoli/code/SWE-Lego-Live

  repositories:
    llama_factory:
      url: https://github.com/hiyouga/LLaMA-Factory.git
      branch: null
      commit: e695fdfa7092fc39e474fb47be4de82b87160a8e
      path: repos/LLaMA-Factory
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: swe-lego-live
      commit: 8f60ee31bc6c0caf36d1fca88b16bb1e024b9c7e
      path: repos/swe_data_process
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/swe_data_process

runtime_info:
  input:
    source:
      # SMOKE: production uses hf_lf (live HF pull). Smoke reads the staged
      # snapshot at artifacts/data/examples/lf_512.json (seeded by
      # subblock/trainer/tests/smoke/prepare_smoke_data.sh).
      type: local_lf
      scaffold: openhands-sdk
      job_dir: ""
      hf_hub_url: "SWE-Lego/samples_for_llama_factory_sft"
      hf_subset: ""
      hf_split: "train"
      lf_path: "artifacts/data/examples/lf_512.json"

    conversion:
      max_instances: 0
      exclude_repos_file: artifacts/data/excluded_repos.txt
      # SMOKE: stable throwaway key — the verifier removes this entry from
      # dataset_info.json after the smoke so it doesn't accumulate.
      data_name: "_smoke_train_ci"

    dataset:
      name: ""                          # auto-derived from conversion.data_name

    model:
      model_name_or_path: /mnt/public/models/Qwen3-8B
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
      template: qwen3_nothink
      cutoff_len: 131072
      rope_scaling: yarn
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      # SMOKE: throwaway dir — verifier removes it after the run.
      output_dir: "_smoke_train_ci"
      logging_steps: 1                  # SMOKE: was 1 (kept for fast feedback)
      save_strategy: "no"               # SMOKE: was steps — no intermediate ckpt-* dirs
      save_steps: 200
      overwrite_output_dir: true
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 1.0e-4
      weight_decay: 0.01
      max_grad_norm: 1.0
      max_steps: 4                      # SMOKE: cap at 4 optimizer steps
      num_train_epochs: 3.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.0                 # SMOKE: was 0.1 (meaningless over 4 steps)
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: disabled              # SMOKE: was offline — no run dirs
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""
      hf_token: ""

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: null
    artifacts:
      train_results: null
      train_loss_plot: null
      training_log: null
    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null
    training_metrics:
      description: Final training metrics from LLaMA-Factory
      value: null

evolving:
  description: SFT training pipeline with tunable hyperparameters.
  tunable_params:
    learning_rate: "Learning rate (1e-5 to 1e-3)"
    num_train_epochs: "Number of training epochs"
    per_device_train_batch_size: "Batch size per GPU"
    gradient_accumulation_steps: "Gradient accumulation steps"
    max_instances: "Maximum training instances"
