# SMOKE CI CONFIG — consumed through SFT_CONFIG by the guarded SFT smoke runner.
# The canonical subblock/trainer/config.yaml is never overwritten.
# Production config lives at subblock/trainer/config.yaml on dev.
# Delta from production is documented in comments tagged "# SMOKE:".
#
# The smoke trains the production pipeline (DeepSpeed ZeRO-3, 8x GPU, cutoff
# 128K) on the staged 512-sample local_lf snapshot, capped at max_steps=4 with
# save_strategy=no — so the run finishes in minutes and writes no checkpoints
# while exercising the production Qwen3.5-35B model/template and shared pipeline
# code paths (dataset registration, train YAML generation, torchrun,
# runtime_info.output write).
meta_info:
  name: trainer
  label: "Trainer"
  description: Trainer block — SFT training pipeline for SWE-bench coding models.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    from:
      source.job_dir:
        from: tracer.output.raw_trajectories_dir
        when: {source.type: harbor_job}
    to: {}

  resources:
    ip: local
    user: null
    pwd: null
    key: null
    port: null
    directory: .

  repositories:
    llama_factory:
      url: https://github.com/SWE-Lego/LLaMA-Factory.git
      branch: main
      commit: 3e32f8ca86a71b94d79d1cd51ad457900ec1dc20
      path: repos/LLaMA-Factory
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: main
      commit: 67aadd1e029c6e9a4b3c4b18bfc68557edb6d3c5
      path: repos/swe_data_process
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/swe_data_process

runtime_info:
  input:
    source:
      # SMOKE: production uses hf_lf + hf_file_name. Smoke reads a staged
      # snapshot of that exact file from artifacts/data/examples/lf_512.json
      # (seeded by subblock/trainer/tests/smoke/prepare_smoke_data.sh).
      type: hf_lf
      scaffold: openhands-sdk
      job_dir: ""
      hf_hub_url: "SWE-Lego/samples_for_llama_factory_sft"
      hf_file_name: "jierun_glm52_openswe_mirror_score4_proto_oh_sdk_512_for_qwen3_5.json"
      hf_subset: ""
      hf_split: "train"
      lf_path: "artifacts/data/examples/lf_512.json"

    conversion:
      max_instances: 0
      exclude_repos_file: scripts/excluded_repos.txt
      # SMOKE: stable throwaway key — the verifier removes this entry from
      # dataset_info.json after the smoke so it doesn't accumulate.
      data_name: "_smoke_train_ci"

    dataset:
      name: ""                          # auto-derived from conversion.data_name

    model:
      model_name_or_path: Qwen/Qwen3.5-35B-A3B-Base
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: scripts/deepspeed/ds_z3_config.json
      template: qwen3_5
      cutoff_len: 131072
      rope_scaling: null
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      # SMOKE: throwaway dir — verifier removes it after the run.
      output_dir: "_smoke_train_ci"
      logging_steps: 1                  # SMOKE: was 1 (kept for fast feedback)
      save_strategy: "no"               # SMOKE: was steps — no intermediate ckpt-* dirs
      save_steps: 200
      overwrite_output_dir: true
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-5
      weight_decay: 0.01
      max_grad_norm: 1.0
      max_steps: 8                      # SMOKE: cap at 4 optimizer steps
      num_train_epochs: 3.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.0                 # SMOKE: was 0.1 (meaningless over 4 steps)
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: disabled              # SMOKE: was offline — no run dirs
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""
      hf_token: ""

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: null
    artifacts:
      train_results: null
      train_loss_plot: null
      training_log: null
    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null
    training_metrics:
      description: Final training metrics from LLaMA-Factory
      value: null

