meta_info:
  name: tracer
  label: "Tracer"
  description: Generates raw agent trajectories with Harbor for downstream SFT data conversion.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    from:
      task_source.dataset_name:
        from: curator.output.merged_tasks_dir
        when: {task_source.provider: local}
    to:
      raw_trajectories_dir:
        to: trainer.input.source.job_dir
        when: {trainer.input.source.type: harbor_job}

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: null
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

  repositories:
    harbor:
      url: https://github.com/SWE-Lego/harbor.git
      branch: main
      commit: ff0434968e5b6975af10d72ca1d7ed20e7fa2465
      path: repos/harbor
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: main
      commit: 538d3838eb8e32fa9e73b2e4b854b1cd1abd01f5   # origin/main HEAD (verified 2026-07-28), defaults reasoning-check-mode to adaptive
      path: repos/swe_data_process
      readonly: true

  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv    # separate venv; harbor env resets to litellm 1.83.0
    swe_data_process_uv: artifacts/env/swe-data-process-uv
    swe_data_process_extras: [llm]
    litellm:
      python_version: "3.13"
      litellm_version: "1.83.14"

runtime_info:
  input:
    llm_api:
      api_key: human
      api_base_url: human
      model: "openai/Qwen3.6-35B-A3B"
      description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      protocols: [openai_compatible, anthropic_compatible]
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4003
      master_key: dummy-key-cf         # functional dummy

    task_source:
      provider: local                  # local (curator) | huggingface — see /tracer:setup reference
      dataset_name: ../curator/artifacts/merged_swe_tasks
      split: train

    harbor_job:
      jobs_dir: artifacts/jobs         # exported by start.sh as TRAJGEN_HARBOR_JOBS_DIR
      n_concurrent: 8
      n_tasks: 40                      # null = all manifest tasks
      max_retries: 2
      timeout_multiplier: 5

    agent:
      name: custom-claude-code
      version: 2.1.118
      runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      runtime_host_path: artifacts/agent-runtime/claude-code   # pre-extracted; see /tracer:check reference
      max_turns: 80
      temperature: 0.7

    sft_conversion:
      enabled: false                   # true = start.sh runs convert step after the Harbor job
      scaffold: auto                   # auto | claude_code | open_code | openhands_sdk | terminus2
      tokenizer_name: Qwen/Qwen3.5-35B-A3B-Base  # align conversion with trainer.model.model_name_or_path
      out_dir: artifacts/sft_data
      max_instances: null
      exclude_repos_file: ""           # "" = repo default artifacts/excluded_repos.txt
      reasoning_check_mode: adaptive
      reasoning_content_ratio_threshold: 0.2

    env_extra:
      # Prior failures (timeout/OOM) + tasks consumed per artifacts/processed_tasks.yaml
      HARBOR_EXCLUDE_TASKS: elastic__elasticsearch-py-3329 elastic__elasticsearch-py-3332 cartography-cncf__cartography-1673 agentscope-ai__agentscope-885 agentscope-ai__agentscope-1342 aider-ai__aider-4146 agentscope-ai__agentscope-964 django-guardian__django-guardian-677 567-labs__instructor-1897 cartography-cncf__cartography-1751 cartography-cncf__cartography-2031

  output:
    raw_trajectories_dir:
      description: Harbor job directories with LiteLLM trajectory logs
      path: artifacts/jobs
      trajectory_format: "artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl"
    sft_data_dir:
      description: LF-format JSON arrays converted from Harbor trajectories, ready for LLaMA-Factory SFT.
      path: artifacts/sft_data
      format: llamafactory_lf_v0.1
      trajectory_format: "artifacts/sft_data/<job>/lf.json"
