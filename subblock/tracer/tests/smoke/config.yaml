# SMOKE CI CONFIG — copied over subblock/tracer/config.yaml by
# .github/workflows/ci.yml before invoking `claude -p "/tracer:run"`.
# Production config lives at subblock/tracer/config.yaml on dev.
# Delta from production is documented in comments tagged "# SMOKE:".
meta_info:
  name: tracer
  label: "Tracer"
  description: Generates raw agent trajectories with Harbor for downstream SFT data conversion. Harbor is managed as a local-only repository under repos/harbor and is updated on demand through the block scripts.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    # SMOKE: task_source.provider is huggingface, so the curator dep is inactive.
    task_source.dataset_name:
      from: curator.output.swe_tasks_dir
      when: {task_source.provider: local}

  resources:
    ip: local
    user: null
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

  repositories:
    harbor:
      url: https://github.com/SWE-Lego/harbor.git
      branch: main
      commit: ff0434968e5b6975af10d72ca1d7ed20e7fa2465
      path: repos/harbor
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: main
      commit: 76cb50cea432fb8687cf192c8ab3f09bb726cb07
      path: repos/swe_data_process
      readonly: true

  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv
    swe_data_process_uv: artifacts/env/swe-data-process-uv
    swe_data_process_extras: [llm]
    litellm:
      python_version: "3.13"
      litellm_version: "1.83.14"

runtime_info:
  input:
    llm_api:
      api_key: dummy-cf
      api_base_url: "https://llm.jierungogogo.com/v1"
      model: "openai/Qwen3.6-35B-A3B"
      description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      protocols: [openai_compatible, anthropic_compatible]
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4003
      master_key: dummy-key-cf

    # SMOKE: small HuggingFace slice — no curator handoff in this smoke.
    task_source:
      provider: huggingface
      dataset_name: SWE-Lego/swerebenchv2-200-260429
      split: train

    harbor_job:
      # SMOKE: jobs land under artifacts/jobs/smoke so they don't mix with prod.
      jobs_dir: artifacts/jobs/smoke
      n_concurrent: 2                  # SMOKE: was 8
      n_tasks: 10                      # SMOKE: was 40
      max_retries: 0                   # SMOKE: was 2
      timeout_multiplier: 5

    agent:
      name: custom-claude-code
      version: 2.1.118
      runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      runtime_host_path: artifacts/agent-runtime/claude-code
      max_turns: 30                    # SMOKE: was 80 — keep trials inside the 2400s budget
      temperature: 0.7

    sft_conversion:
      enabled: false                   # SMOKE: skip conversion step
      scaffold: auto
      out_dir: artifacts/sft_data
      max_instances: null
      exclude_repos_file: ""

    env_extra:
      # SMOKE: same exclusion list as production — task IDs known to fail.
      HARBOR_EXCLUDE_TASKS: elastic__elasticsearch-py-3329 elastic__elasticsearch-py-3332 cartography-cncf__cartography-1673 agentscope-ai__agentscope-885 agentscope-ai__agentscope-1342 aider-ai__aider-4146 agentscope-ai__agentscope-964 django-guardian__django-guardian-677 567-labs__instructor-1897 cartography-cncf__cartography-1751 cartography-cncf__cartography-2031
      # SMOKE: force a single uvicorn worker (skip gunicorn's 30s boot timeout).
      LITELLM_NUM_WORKERS: "1"

  output:
    raw_trajectories_dir:
      description: Harbor job directories with LiteLLM trajectory logs
      path: artifacts/jobs
      trajectory_format: "artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl"
      consumer_block: trainer
    sft_data_dir:
      description: LF-format JSON arrays converted from Harbor trajectories, ready for LLaMA-Factory SFT.
      path: artifacts/sft_data
      format: llamafactory_lf_v0.1
      trajectory_format: "artifacts/sft_data/<job>/lf.json"
      consumer_block: trainer

