meta_info:
  name: curator
  label: "Curator"
  description: Converts GitHub PRs into verified SWE-Bench tasks across 8 programming languages (Python, JavaScript, TypeScript, Go, C, C++, Java, Rust).
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    from: {}   # task source block; no upstream
    to:
      merged_tasks_dir:
        to: tracer.input.task_source.dataset_name
        when: {tracer.input.task_source.provider: local}

  repos:
    swegen:
      name: swegen
      commit_id: null   # latest
      role: core pipeline - CLI, task generation, validation, scoring

  environment:
    venv_name: swegen-env
    venv_path: artifacts/envs/swegen-env
    requirements: repos/swegen/pyproject.toml
    python_version: "3.12+"
    description: Virtual environment for swegen CLI and dependencies

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    # user / pwd / directory apply only when ip is a remote IP (SSH target).
    # They are ignored for local execution — the block runs from its own dir.
    user: null
    pwd: null
    directory: null
    description: CPU node with Docker; runs locally by default.
    public_storage: null

runtime_info:
  input:
    pr_collection:
      enabled: true
      languages: [c, cpp, go, java, javascript, typescript, python, rust]
      repo_num: 100                   # repos WITH qualifying PRs per language
      max_prs_per_repo: 50
      output_dir: artifacts/collected_prs
      token_limit: 32                 # first N combined file + env tokens (0 = all)
      filters:
        min_stars: 30
        min_merged_prs: 5
        min_language_percentage: 0.4
        max_days_since_push: 1095
        min_issue_body_length: 10
        min_files_changed: 1
        max_files_changed: 25
        max_lines_changed: 1500

    # Two LLM API Modes:
    # ----- Mode A: NON-Anthropic model (e.g. local Qwen via openai_proxy) -----
    # Tested end-to-end (NOP=0/Oracle=1) with these exact values:
    # llm_api:
    #   api_key: dummy-cf
    #   api_base_url: https://llm.jierungogogo.com/v1
    #   pr_model: Qwen3.6-35B-A3B
    #   task_model: claude-sonnet-4-6        # any claude-* alias; proxy maps it to pr_model
    #   cc_provider_mode: openai_proxy
    #   anthropic_base_url: http://127.0.0.1:4010
    #   cc_proxy_port: 4010
    #
    # ----- Mode B: Anthropic-format model (e.g. claude-opus-4-6 via gateway) -----
    # Tested end-to-end (NOP=0/Oracle=1) with these exact values:
    # llm_api:
    #   api_key: <YOUR_KEY>
    #   api_base_url: https://yunwu.ai/v1            # OpenAI-compatible side of the same gateway
    #   pr_model: claude-opus-4-6
    #   task_model: claude-opus-4-6
    #   cc_provider_mode: native
    #   anthropic_base_url: https://yunwu.ai         # provider Anthropic root, no /v1
    #   # cc_proxy_port not used in native mode
    # =========================================================================
    llm_api:
      api_key: human                          # never commit a real key; prefer env/.env
      api_base_url: human                     # OpenAI-compatible endpoint (PR eval + instruction gen)
      pr_model: Qwen3.6-35B-A3B
      task_model: claude-sonnet-4-6           # Claude Code path (task completion + verification)
      cc_provider_mode: openai_proxy          # native | openai_proxy
      anthropic_base_url: http://127.0.0.1:4010   # native: provider URL | openai_proxy: local proxy URL
      cc_proxy_port: 4010                     # openai_proxy only

    github_token: ""    # never fill in config.yaml; use GITHUB_TOKENS/GITHUB_TOKEN or gh_token.txt

    # Per-language knobs read by scripts/read_params.py + scripts/create_<lang>.sh.
    # max_verified_tasks: N = stop after N verified tasks; "all" = no cap, consume all collected PRs.
    languages:
      py:   { enabled: false,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 24, max_verified_tasks: 256 } }
      js:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16, max_verified_tasks: 128 } }
      ts:   { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16, max_verified_tasks: 128 } }
      go:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16, max_verified_tasks: 128 } }
      c:    { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16, max_verified_tasks: 128 } }
      cpp:  { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16, max_verified_tasks: 128 } }
      java: { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16, max_verified_tasks: 128 } }
      rust: { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16, max_verified_tasks: 128 } }

  output:
    swe_tasks_dir:
      path: artifacts/swe_tasks
      description: Per-language task directories ({lang}-cc/), each with verifiable_tasks.txt listing verified task IDs
      structure: "artifacts/swe_tasks/{lang}-cc/{task_id}/ with instruction.md, environment/, solution/, tests/"

    merged_tasks_dir:
      path: artifacts/merged_swe_tasks_copy
      description: Optional flattened directory containing all verified tasks from all languages (populated by scripts/extract_verified_tasks.py)
      structure: "artifacts/merged_swe_tasks_copy/{task_id}/ with instruction.md, environment/, solution/, tests/"
      extract_command: python scripts/extract_verified_tasks.py

    logs:
      path: artifacts/logs/swegen-create
      description: "Per-language create logs: cc_<lang>_March.txt"

