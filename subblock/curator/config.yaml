# curator block config — one-shot per run; live state lives in artifacts/index.yaml.
# Fill rules: `human` = you must set this before a run; "" = auto-derived or env-supplied;
# everything else is a working default. Validate: python3 ../../scripts/validate_config.py --block .
# Field reference & worked examples: /curator:setup · Gotchas & preflight: /curator:check
# GitHub tokens are NOT stored here — export GITHUB_TOKENS / GITHUB_TOKEN or use gh_token.txt.

meta_info:
  name: curator
  label: "Curator"
  description: Converts GitHub PRs into verified SWE-Bench tasks across 8 programming languages (Python, JavaScript, TypeScript, Go, C, C++, Java, Rust).
  parent: swe_lego_live
  subblocks: {}
  dependencies: {}   # task source block; no upstream

  repos:
    swegen:
      name: swegen
      commit_id: null   # latest
      role: core pipeline - CLI, task generation, validation, scoring

  environment:
    venv_name: swegen-env
    venv_path: artifacts/envs/swegen-env
    requirements: repos/swegen/pyproject.toml
    python_version: "3.10+"
    description: Virtual environment for swegen CLI and dependencies

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: root
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

runtime_info:
  input:
    # Knobs for tools/collect_prs_wo_image.py, exported by scripts/load_runtime_env.sh
    # as SWEGEN_COLLECT_* / SWEGEN_PR_* / COLLECT_TOKEN_LIMIT. Null filter = collector default.
    pr_collection:
      enabled: true
      languages: [c, cpp, go, java, javascript, typescript, python, rust]
      repo_num: 100                   # repos WITH qualifying PRs per language
      max_prs_per_repo: 50
      output_dir: artifacts/collected_prs
      token_limit: 32                 # first N combined file + env tokens (0 = all)
      filters:
        min_stars: 30
        min_merged_prs: 5
        min_language_percentage: 0.4
        max_days_since_push: 1095
        min_issue_body_length: 10
        min_files_changed: 1
        max_files_changed: 25
        max_lines_changed: 1500

    # Two LLM API paths — BOTH must be right or verification fails silently.
    # Modes, worked examples, and the env-var mapping: /curator:setup reference.
    llm_api:
      api_key: human                          # never commit a real key; prefer env/.env
      api_base_url: human                     # OpenAI-compatible endpoint (PR eval + instruction gen)
      pr_model: Qwen3.6-35B-A3B
      task_model: claude-sonnet-4-6           # Claude Code path (task completion + verification)
      cc_provider_mode: openai_proxy          # native | openai_proxy
      anthropic_base_url: http://127.0.0.1:4010   # native: provider URL | openai_proxy: local proxy URL
      cc_proxy_port: 4010                     # openai_proxy only

    # Per-language knobs read by scripts/read_params.py + scripts/create_<lang>.sh.
    languages:
      py:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 20 } }
      js:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      ts:   { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16 } }
      go:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      c:    { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      cpp:  { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      java: { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      rust: { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16 } }

  output:
    swe_tasks_dir:
      path: artifacts/swe_tasks
      description: Per-language task directories ({lang}-cc/), each with verifiable_tasks.txt listing verified task IDs
      structure: "artifacts/swe_tasks/{lang}-cc/{task_id}/ with instruction.md, environment/, solution/, tests/"

    merged_tasks_dir:
      path: artifacts/merged_swe_tasks
      description: Optional flattened directory containing all verified tasks from all languages (populated by scripts/extract_verified_tasks.py)
      structure: "artifacts/merged_swe_tasks/{task_id}/ with instruction.md, environment/, solution/, tests/"
      extract_command: python scripts/extract_verified_tasks.py

    logs:
      path: artifacts/logs/swegen-create
      description: "Per-language create logs: cc_<lang>_March.txt"
