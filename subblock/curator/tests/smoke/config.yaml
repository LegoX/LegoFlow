# SMOKE CI CONFIG — copied over subblock/curator/config.yaml by
# .github/workflows/ci.yml before .github/cicd/smoke/run.sh launches the
# smoke. Production config lives at subblock/curator/config.yaml on dev.
#
# Design: schema-compatible with the production config — every key that
# exists in production keeps its name and meaning. Production fields the
# smoke doesn't consume are pruned. The smoke-specific fields all live in
# `runtime_info.input.smoke.*`.

meta_info:
  name: curator
  label: "Curator"
  description: Converts GitHub PRs into verified SWE-Bench tasks. Smoke mode runs against a committed PR list.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    from: {}
    to: {}

  repos:
    swegen:
      name: swegen
      commit_id: null

  environment:
    venv_name: swegen-env
    venv_path: artifacts/envs/swegen-env

  resources:
    ip: local
    user: root
    pwd: null
    directory: /gpufs/haoli/code/

runtime_info:
  input:
    # Reliable OpenAI-only endpoint (llm12 / Qwen3.6-35B-A3B) reached through a
    # local LiteLLM CC proxy — verified cleanly by 10_pr_demo.sh. The smoke
    # runner (.github/scripts/smoke_run.sh) starts the proxy on cc_proxy_port.
    # History (all in NATIVE-anthropic mode, which is why native was abandoned):
    # <an-alternate-provider>/<model> had real PASSes but was flaky AND needed a
    # committed real key; GLM-5-FP8 gave 0 verified, opus/sonnet returned empty
    # for swegen's verdict-shaped prompt. openai_proxy + Qwen sidesteps all of
    # it — no real key (the llm endpoint takes the dummy-cf CF token).
    llm_api:
      api_key: ""
      api_base_url: ""
      pr_model: ""
      task_model: ""
      cc_provider_mode: openai_proxy
      anthropic_base_url: http://127.0.0.1:4010
      cc_proxy_port: 4010

    # Smoke uses only py. Other languages and the adaptive `global` /
    # `status` blocks from production are dropped; they're not read by
    # `swegen create`.
    languages:
      py:
        enabled: true
        params:
          # SMOKE: shorter than production (was 3200 / 2400 / 20). Same
          # field names — read by .github/scripts/smoke_run.sh.
          timeout: 2400
          cc_timeout: 1800
          # Smoke runs 5 PRs in parallel and stops at the first verified one
          # (max_pr=1). The 10-PR fixture decays over time (upstream
          # Dockerfile/test drift); 5-wide concurrency hedges against any one
          # PR being upstream-broken on a given day. 5 chosen over 10 to keep
          # the load on the LLM endpoint + Harbor docker pool reasonable
          # (each PR runs an LLM-driven Claude Code agent + 2 verifier
          # containers; 5 concurrent ≈ 10 docker containers + 5 in-flight
          # agent SDK sessions, which is the empirical sweet spot before
          # CF 524s and host docker pressure start showing up).
          n_concurrent: 5

    # Smoke-only knobs that production config doesn't express (these live
    # hardcoded inside scripts/create_<lang>.sh in production). The smoke
    # surfaces them so the smoke shape stays declarative.
    smoke:
      max_pr: 1                       # stop after N verified tasks
      min_source_files: 1             # relax production's --min-source-files 3
      max_source_files: 10
      docker_prune_batch: 0
      # Output subdir, appended to runtime_info.output.swe_tasks_dir.path.
      # Result: artifacts/swe_tasks/py-cc-smoke (full path used by verify.sh).
      output_subdir: py-cc-smoke
      state_subdir: .swegen-smoke-py
      # PR list the smoke iterates. swegen stops after `max_pr` successfully
      # verified tasks (1 by default). Keep multiple PRs as fallbacks if an
      # upstream Dockerfile drifts and one fails to build.
      #
      # Order: known-good first; PRs observed to upstream-flake recently
      # (Docker image build, verifier reward.txt missing, etc.) move to the
      # END so the parallel slots don't waste time on them. The last two
      # both failed verifier in run 27820262416 (2026-06-19):
      #   - tox-dev/tox:pr-3813               — was the 6-times historical
      #     "always passed" PR but failed today (Harbor `docker inspect
      #     returned 1`).
      #   - AnswerDotAI/RAGatouille:pr-157    — failed verifier (no reward
      #     file).
      # If they recover, they're still in the pool; if they stay broken,
      # the 8 untested PRs above them get the first 5 parallel slots and
      # have first crack at PASS.
      input_prs:
        - tox-dev/tox:pr-3814
        - tox-dev/tox:pr-3810
        - electricitymaps/electricitymaps-contrib:pr-8113
        - tox-dev/tox:pr-3803
        - morpheus65535/bazarr:pr-2691
        - tox-dev/tox:pr-3804
        - tox-dev/tox:pr-3800
        - electricitymaps/electricitymaps-contrib:pr-8119
        - tox-dev/tox:pr-3813                 # demoted 2026-06-19 (run 27820262416)
        - AnswerDotAI/RAGatouille:pr-157      # demoted 2026-06-19 (run 27820262416)

  # Reused from production: smoke output paths are derived from this base.
  output:
    swe_tasks_dir:
      path: artifacts/swe_tasks
