# terminalgen block config — one-shot per run; live state lives in artifacts/index.yaml
# (adaptive per-domain counters live in artifacts/domain_status.yaml).
# Fill rules: `human` = you must set this before a run; "" = auto-derived or env-supplied;
# everything else is a working default. Validate: python3 ../../scripts/validate_config.py --block .
# Field reference & worked examples: /terminalgen:setup · Gotchas & preflight: /terminalgen:check

meta_info:
  name: terminalgen
  label: "Terminal-gen"
  description: Converts StackOverflow Q&A into verified terminal-bench tasks across 13 task domains via the terminal-lego pipeline (scrape → generate → validate). Parallel to curator; runs as an adaptive agent that monitors per-domain success rates and tunes pipeline parameters automatically.
  parent: swe_lego_live
  subblocks: {}
  dependencies: {}   # task source block; no upstream

  repos:
    terminal-lego:
      name: terminal-lego
      url: https://github.com/SWE-Lego/terminal-lego.git
      commit_id: 1a2a6048a0d568891407ed3c6a441c995f4491b0
      role: core pipeline — StackOverflow scraper, LLM task generator, Docker validator (read-only dependency; never modified)

  environment:
    venv_name: terminalgen-env
    venv_path: artifacts/envs/terminalgen-env
    requirements: requirements.txt
    python_version: "3.10+"
    description: Virtual environment for the terminal-lego pipeline (requests) plus PyYAML for this block's config-parsing scripts

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: root
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

runtime_info:
  input:
    so_api_key: ""                     # via $SO_API_KEY (10000 req/day with key, 300 without)

    llm_api:
      api_key: human                   # set the real key via OPENAI_API_KEY env / .env (never commit it)
      api_base_url: https://az.gptplus5.com/v1
      gen_model: deepseek-v4-flash     # generator reads --api-base; keep gen_model resolvable on the endpoint

    # Adaptive tuning configuration; live per-domain counters: artifacts/domain_status.yaml
    global:
      monitor_interval_min: 30
      question_pool_min_threshold: 100
      crawl_defaults:
        count_per_round: 200
        min_score: 10
      restart_policy:
        allowed: true
        zero_success_cycles: 3
      param_bounds:
        gen_workers: {min: 1, max: 16, step: 1}
        val_workers: {min: 1, max: 8, step: 1}
        val_timeout: {min: 120, max: 1800, step: 60}   # keep >=900 on slow networks — see /terminalgen:check reference

    # 13 domains bucketed from terminal-lego's 54 tags (arXiv 2606.03461 Table 11).
    domains:
      core-terminal-os:
        enabled: true
        tag_filter: [linux, bash, shell, command-line, terminal, unix, ubuntu, debian, centos, systemd, cron, chmod, sudo, sed, awk, grep, string, vim, tmux]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 900}
      versioning-containers:
        enabled: true
        tag_filter: [git, docker, kubernetes, virtualization, qemu]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 300}
      networking-services:
        enabled: true
        tag_filter: [networking, network-programming, tcp, udp, sockets, socket, raw-sockets, websocket, multicast, packet, ip, http, https, dns, ssh, nginx, apache, iptables, firewall, curl, wget]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 900}
      file-text-processing:
        enabled: true
        tag_filter: [file-io, tar, gzip, zip, json, csv, xml, yaml, regex]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 900}
      python-ecosystem:
        enabled: true
        tag_filter: [python, pip, virtualenv, conda]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 300}
      ml-data:
        enabled: true
        tag_filter: [pandas, numpy, matplotlib, jupyter-notebook, pytorch, tensorflow, scikit-learn, machine-learning, deep-learning, keras, nlp, huggingface-transformers, parquet]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 360}
      databases-storage:
        enabled: true
        tag_filter: [sqlite, mysql, postgresql, redis, mongodb]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 360}
      web-automation-apis:
        enabled: true
        tag_filter: [web-scraping, requests, beautifulsoup, selenium, api]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 300}
      security-cryptography:
        enabled: true
        tag_filter: [encryption, cryptography, hash, security, ssl, ssl-certificate, openssl]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 300}
      debugging-reliability:
        enabled: true
        tag_filter: [debugging, logging, exception]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 900}
      algorithms-concurrency:
        enabled: true
        tag_filter: [algorithm, sorting, recursion, data-structures, multiprocessing, multithreading, asyncio]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 900}
      media-scientific:
        enabled: true
        tag_filter: [ffmpeg, opencv, image-processing, r, scipy, sympy]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 360}
      build-editor-tooling:
        enabled: true
        tag_filter: [makefile, cmake, gcc]
        params: {gen_workers: 4, val_workers: 4, val_timeout: 300}

  output:
    terminal_tasks_dir:
      path: artifacts/terminal_tasks
      description: Per-domain task directories ({domain}-tl/), each with verifiable_tasks.txt listing verified task IDs (terminal-lego v1.0 schema). This is the primary downstream-consumable output.
      structure: "artifacts/terminal_tasks/{domain}-tl/{task_id}/ with instruction.md, task.toml, environment/, solution/, tests/"

    merged_tasks_dir:
      path: artifacts/merged_terminal_tasks
      description: Optional flat directory of all verified tasks (terminal-lego v1.0, same format as in-place — no conversion), populated by scripts/extract_verified_tasks.py. Convenience single-root for tools that expect one; downstream can equally read the per-domain dirs directly.
      structure: "artifacts/merged_terminal_tasks/{domain}__{task_id}/ with v1.0 task.toml, instruction.md, environment/, solution/, tests/"
      extract_command: python scripts/extract_verified_tasks.py

    examples_dir:
      path: artifacts/examples
      description: Committed known-good verified task examples (terminal-lego v1.0), for the operating agent to reference the expected output shape without re-running the pipeline. See artifacts/examples/README.md.

    logs:
      path: artifacts/logs
      description: "Per-domain create logs (terminalgen-create/tl_<domain>.txt) and adaptive tuning decisions (adaptive_decisions.jsonl)"
