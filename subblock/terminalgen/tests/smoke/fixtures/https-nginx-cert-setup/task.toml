schema_version = "1.1"

[task]
name = "terminal-lego/https-nginx-cert-setup"
description = "Configure nginx with a Let's Encrypt SSL/TLS certificate, HTTP-to-HTTPS redirect, modern cipher suites, security headers, and auto-renewal. Output the resulting nginx.conf, certificate-info.txt, verification-report.txt, and setup.log to /app/task_file/output and /app/task_file/logs."
authors = ["terminal-lego"]
keywords = ["nginx", "https", "ssl", "certbot", "letsencrypt", "stackoverflow"]

[metadata]
author_name = "StackOverflow Community"
