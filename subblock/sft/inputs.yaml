# Edit this file before running any script. All paths relative to block root
# unless they are absolute. Run bash scripts/dryrun.sh to validate before launching.

# ---------------------------------------------------------------------------
# Step 1: Raw trajectory source
# ---------------------------------------------------------------------------
source:
  provider: jierun              # choices: jierun | chaofan
  scaffold: openhands-sdk       # choices: openhands-sdk | claude-code | open-code | terminus2
                                #          openhands (chaofan only)

  # For jierun: path to the harbor job directory (--job-dir)
  job_dir: "artifacts/data/raw/raw_data/swerebench-filtered-oraclesolved-openhands-sdk-1.14.0-GLM-5-FP8-30-20260322001450-sample100"                   # e.g. /home/.../harbor/jobs/swerebench-...-20260322001450
  # For jierun cc / oc / openhands-sdk: trajectory logger dir (--trajs-dir)
  # Leave empty to use default: {job_dir}_trajs_via_logger
  trajs_dir: "artifacts/data/raw/raw_data/swerebench-filtered-oraclesolved-openhands-sdk-1.14.0-GLM-5-FP8-30-20260322001450-sample100_trajs_via_logger"

  # For chaofan: path to the completions source directory (--source-dir)
  source_dir: ""                # e.g. /home/.../harbor/jobs-GLM-5-ready/glm5-oraclesolved/jobs-...-success

# ---------------------------------------------------------------------------
# Step 2: Data conversion
# ---------------------------------------------------------------------------
conversion:
  max_instances: 64           # 0 or negative = no limit
  # Repo exclusion list — filters out eval benchmark repos (SWE-bench_Verified/Pro/Multilingual)
  # Set to "" to disable filtering
  exclude_repos_file: artifacts/data/excluded_repos.txt
  # data_name derives both output paths:
  #   im_output = artifacts/data/im_data/{data_name}.jsonl
  #   lf_output = artifacts/data/lf_data/{data_name}.json
  data_name: "jierun_glm5_swerebench_oraclesolved_oh_sdk_test"

# ---------------------------------------------------------------------------
# Step 3: Dataset registration (LLaMA-Factory dataset_info.json)
# ---------------------------------------------------------------------------
dataset:
  name: ""                      # key in dataset_info.json; leave empty to auto-derive
                                # from lf_output filename (recommended)
                                # e.g. jierun_glm5_swerebench_oraclesolved_oh_sdk_test

# ---------------------------------------------------------------------------
# Step 4: Model & training
# (train.sh generates the LLaMA-Factory YAML on-the-fly from these fields)
# ---------------------------------------------------------------------------
model:
  model_name_or_path: /mnt/ydu/models/Qwen3-8B
  trust_remote_code: true

training:
  # --- method ---
  stage: sft
  finetuning_type: full
  deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
                                                     # choices: ds_z0 | ds_z2 | ds_z3 | ds_z2_offload | ds_z3_offload

  # --- dataset ---
  template: qwen3_nothink        # choices: qwen3_nothink | qwen3
  cutoff_len: 131072
  rope_scaling: yarn             # required when cutoff_len > 32768
  max_samples: 1000000
  preprocessing_num_workers: 16
  dataloader_num_workers: 4

  # --- output ---
  # output_dir basename is placed under artifacts/model/ (absolute path resolved by train.sh)
  # Naming convention: qwen3_8b_{data_name}_{n}_{hyperparam}_{think}
  # e.g. qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think
  output_dir: "qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think"
  logging_steps: 1
  save_strategy: steps             # choices: steps | epoch
  save_steps: 200
  overwrite_output_dir: true
  save_only_model: true          # false = save optimizer state (enables resume)
  resume_from_checkpoint: null   # set to checkpoint dir path to resume

  # --- train ---
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8  # global batch = per_device × accum × n_gpus = 64 @ 8 GPUs
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 4.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  ddp_timeout: 180000000
  enable_liger_kernel: true
  use_unsloth_gc: true
  flash_attn: fa2                 # choices: fa2 | disabled | auto

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------
infrastructure:
  n_gpus_per_node: 8            # number of GPUs on the current compute node

# ---------------------------------------------------------------------------
# Experiment
# ---------------------------------------------------------------------------
experiment:
  run_name: ""                  # leave empty to auto-derive from output_dir basename (recommended)
  wandb_mode: offline            # choices: online | offline | disabled
  wandb_run_id: ""              # set to resume an existing WandB run

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
credentials:
  wandb_api_key: ""             # required for wandb_mode=online; optional for offline; ignored when disabled
