meta_info:
  name: sft
  label: "SFT Training"
  description: SFT training pipeline for SWE-bench coding models. Converts raw agent trajectories from multiple scaffolds into LLaMA-Factory sharegpt format, then trains models via LLaMA-Factory + DeepSpeed (ZeRO-3).
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    trajectories_dir: trajgen.output.raw_trajectories_dir  # path: subblock/trajgen/artifacts/jobs

  repos:
    llama_factory:
      name: LLaMA-Factory
      commit_id: null
      role: training framework (LLaMA-Factory + DeepSpeed ZeRO-3)
    swe_data_process:
      name: swe_data_process
      commit_id: null
      role: data processing (trajectory converters, quality scorers)

  environment:
    harbor_uv: artifacts/env/lf
    requirements: repos/LLaMA-Factory/pyproject.toml

  resources:
    ip: null
    pwd: null
    directory: /gpufs/haoli/code/SWE-Lego-Live
    public_storage: /gpufs/haoli/swedata

runtime_info:
  input:
    source:
      provider: jierun              # choices: jierun | chaofan
      scaffold: openhands-sdk       # choices: openhands-sdk | claude-code | open-code | terminus2 | openhands
      job_dir: "artifacts/data/raw/raw_data/swerebench-filtered-oraclesolved-openhands-sdk-1.14.0-GLM-5-FP8-30-20260322001450-sample100"
      trajs_dir: "artifacts/data/raw/raw_data/swerebench-filtered-oraclesolved-openhands-sdk-1.14.0-GLM-5-FP8-30-20260322001450-sample100_trajs_via_logger"
      source_dir: ""

    conversion:
      max_instances: 64
      exclude_repos_file: artifacts/data/excluded_repos.txt
      data_name: "jierun_glm5_swerebench_oraclesolved_oh_sdk_test"

    dataset:
      name: ""                      # auto-derived from lf_output filename

    model:
      model_name_or_path: /mnt/ydu/models/Qwen3-8B
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
      template: qwen3_nothink
      cutoff_len: 131072
      rope_scaling: yarn
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      output_dir: "qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think"
      logging_steps: 1
      save_strategy: steps
      save_steps: 200
      overwrite_output_dir: true
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 1.0e-4
      weight_decay: 0.01
      max_grad_norm: 1.0
      num_train_epochs: 4.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: offline
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: /gpufs/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/checkpoint-4

    artifacts:
      train_results: /gpufs/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/train_results.json
      train_loss_plot: /gpufs/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/training_loss.png
      training_log: /gpufs/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/logs/qwen3_8b_jierun_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think_20260428_012158.log

    training_curves:
      description: WandB run with loss, learning rate, and token metrics
      value: null

evolving:
  description: SFT training pipeline with tunable hyperparameters for learning rate, batch size, epochs, and model architecture.
  tunable_params:
    learning_rate: "Learning rate (1e-5 to 1e-3)"
    num_train_epochs: "Number of training epochs"
    per_device_train_batch_size: "Batch size per GPU"
    gradient_accumulation_steps: "Gradient accumulation steps"
    max_instances: "Maximum training instances"
