meta_info:
  name: sft
  label: "SFT Training"
  description: SFT training pipeline for SWE-bench coding models. Converts raw agent trajectories from multiple scaffolds into LLaMA-Factory sharegpt format, then trains models via LLaMA-Factory + DeepSpeed (ZeRO-3).
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    trajectories_dir: trajgen.output.raw_trajectories_dir  # path: subblock/trajgen/artifacts/jobs

  resources:
    ip: null
    pwd: null
    directory: /public/storage/haoli/code/SWE-Lego-Live
    public_storage: /public/storage/haoli/swedata

  repositories:
    llama_factory:
      url: https://github.com/hiyouga/LLaMA-Factory.git
      branch: null
      commit: e695fdfa7092fc39e474fb47be4de82b87160a8e
      path: repos/LLaMA-Factory
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: swe-lego-live
      commit: 8f60ee31bc6c0caf36d1fca88b16bb1e024b9c7e
      path: repos/swe_data_process
      readonly: true

  environment:
    sft_uv: artifacts/env/lf
    python_version: "3.12"
    packages:
      - repos/LLaMA-Factory
      - repos/swe_data_process

runtime_info:
  input:
    source:
      scaffold: claude-code       # choices: openhands-sdk | claude-code | open-code | terminus2
      job_dir: "/public/storage/haoli/code/SWE-Lego-Live/subblock/trajgen/artifacts/jobs/swerebenchv2-200-260429-custom-claude-code-2.1.118-MiniMax-M2.7-20260513230507"

    conversion:
      max_instances: 64
      exclude_repos_file: artifacts/data/excluded_repos.txt
      data_name: "glm5_swerebench_oraclesolved_oh_sdk_test"

    dataset:
      name: ""                      # auto-derived from conversion.data_name

    model:
      model_name_or_path: /jyx_data/models/Qwen/Qwen3-8B
      trust_remote_code: true

    training:
      stage: sft
      finetuning_type: full
      deepspeed: artifacts/training_config/deepspeed/ds_z3_config.json
      template: qwen3_nothink
      cutoff_len: 131072
      rope_scaling: yarn
      max_samples: 1000000
      preprocessing_num_workers: 16
      dataloader_num_workers: 4
      output_dir: "qwen3_8b_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think"
      logging_steps: 1
      save_strategy: steps
      save_steps: 200
      overwrite_output_dir: true
      save_only_model: true
      resume_from_checkpoint: null
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 1.0e-4
      weight_decay: 0.01
      max_grad_norm: 1.0
      num_train_epochs: 4.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      ddp_timeout: 180000000
      enable_liger_kernel: true
      use_unsloth_gc: true
      flash_attn: fa2

    infrastructure:
      n_gpus_per_node: 8

    experiment:
      run_name: ""
      wandb_mode: offline
      wandb_run_id: ""

    credentials:
      wandb_api_key: ""

  output:
    checkpoint_path:
      description: Path to the latest trained model checkpoint
      value: /public/storage/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/checkpoint-4

    artifacts:
      train_results: /public/storage/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/train_results.json
      train_loss_plot: /public/storage/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/model/qwen3_8b_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think/training_loss.png
      training_log: /public/storage/haoli/code/SWE-Lego-Live/subblock/sft/artifacts/logs/qwen3_8b_glm5_swerebench_oraclesolved_oh_sdk_test_gbs64pbs1acc8_lr1e-4_epo4_think_20260428_012158.log

    training_curves:
      description: WandB run id with loss, learning rate, and token metrics
      value: null

evolving:
  description: SFT training pipeline with tunable hyperparameters for learning rate, batch size, epochs, and model architecture.
  tunable_params:
    learning_rate: "Learning rate (1e-5 to 1e-3)"
    num_train_epochs: "Number of training epochs"
    per_device_train_batch_size: "Batch size per GPU"
    gradient_accumulation_steps: "Gradient accumulation steps"
    max_instances: "Maximum training instances"
