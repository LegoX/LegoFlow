# Edit this file before running trajgen scripts. Paths are relative to this
# block root unless absolute.

repositories:
  harbor:
    url: https://github.com/SWE-Lego/harbor.git
    branch: main
    # Optional reproducibility pin. When non-empty, scripts/update_repos.sh
    # checks out this exact commit after fetching the branch.
    commit: 3062421c03d89a5e980684873840e6644e756771
    path: repos/harbor
    readonly: true

environment:
  # Checked by scripts/dryrun.sh and scripts/start.sh before any Harbor task run.
  # Keep uv's project environment outside repos/harbor so the managed checkout
  # can remain read-only.
  harbor_uv: artifacts/env/harbor-uv
  litellm_uv: artifacts/env/litellm-uv
  litellm:
    python_version: "3.13"
    litellm_version: "1.83.9"

model_api:
  # Raw upstream OpenAI-compatible model API. Each Harbor job can start its own
  # LiteLLM proxy from these values before launching agent rollouts.
  upstream_model: "openai/GLM-5-FP8"
  api_base: "http://llm35.jierungogogo.com/v1"
  api_key: "dummy-key"
  input_cost_per_token: 0.0000021
  output_cost_per_token: 0.0000084

litellm_proxy:
  # Per-job LiteLLM proxy config generated from model_api before Harbor starts.
  # scripts/start.sh writes the config under artifacts/litellm/<job>/ and passes
  # it to Harbor's serve_litellm.sh through LITELLM_CONFIG.
  config_template: scripts/serve_llm/litellm_config.example.yaml
  port: 4001
  master_key: dummy-key-cf

# Source tasks for Harbor. provider describes where the task set comes from,
# not the downstream trajectory format.
task_source:
  provider: huggingface           # currently supported by prepare_tasks.sh
  dataset_name: SWE-Lego/swerebenchv2-200-260429
  split: train

harbor_job:
  # This is the trajgen block output root for Harbor job results.
  # Store jobs under this block's artifacts directory, not under repos/harbor.
  # scripts/start.sh exports this as TRAJGEN_HARBOR_JOBS_DIR.
  jobs_dir: artifacts/jobs
  n_concurrent: 1
  n_tasks: null                   # set to 1 for smoke tests
  max_retries: 2
  timeout_multiplier: 2

agent:
  name: custom-claude-code
  version: 2.1.118
  runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
  max_turns: 200
  temperature: 0.7
