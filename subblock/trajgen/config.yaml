meta_info:
  name: trajgen
  label: "Trajectory Generation"
  description: Generates raw agent trajectories with Harbor for downstream SFT data conversion. Harbor is managed as a local-only repository under repos/harbor and is updated on demand through the block scripts.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    task_source_dir: swegen.output.swe_tasks_dir   # path: subblock/swegen/artifacts/swe_tasks

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: null
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

  repositories:
    harbor:
      url: https://github.com/SWE-Lego/harbor.git
      branch: main
      commit: ff0434968e5b6975af10d72ca1d7ed20e7fa2465
      path: repos/harbor
      readonly: true
    swe_data_process:
      url: https://github.com/SWE-Lego/swe_data_process.git
      branch: main
      commit: 76cb50cea432fb8687cf192c8ab3f09bb726cb07   # origin/main HEAD (fetched 2026-06-01), merges PR #4 "Add dataset-level tool-call error rate to LF stats"
      path: repos/swe_data_process
      readonly: true

  environment:
    harbor_uv: artifacts/env/harbor-uv
    litellm_uv: artifacts/env/litellm-venv  # separate venv; harbor env is managed by uv run and resets to 1.83.0
    swe_data_process_uv: artifacts/env/swe-data-process-uv
    swe_data_process_extras: [llm]    # installs openai for optional LLM scoring
    litellm:
      python_version: "3.13"
      litellm_version: "1.83.14"

# ---------------------------------------------------------------------------

runtime_info:
  input:
    llm_api:
      api_key: dummy-cf
      api_base_url: "http://llm10.jierungogogo.com/v1"
      model: "openai/GLM-5-FP8"
      description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      protocols: [openai_compatible, anthropic_compatible]
      served_via: per_job_litellm_proxy
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084

    # llm_api:
      # api_key: sk-Rz6InDxYzznd3uCXk3ectMXoLlzjkItSTLl3L7jdELFuHKrY             # LLM API key for PR evaluation and instruction generation
      # api_base_url: https://az.gptplus5.com/v1        # OpenAI-compatible API endpoint
      # model: openai/deepseek-v4-flash
      # description: Raw upstream model API used to configure per-job LiteLLM proxy startup.
      # protocols: [openai_compatible, anthropic_compatible]

    litellm_proxy:
      config_template: scripts/serve_llm/litellm_config.example.yaml
      port: 4003   # 4001 squatted by an unowned stale LiteLLM; 4002 reserved for the host-wide root-owned LiteLLM
      master_key: dummy-key-cf

    # task_source: wired from swegen.output.swe_tasks_dir (dependency declared in meta_info.dependencies)
    # task_source:
    #   provider: local
    #   dataset_name: ../swegen/artifacts/swe_tasks/py-cc
      # prepare_tasks.sh filters by py-cc/verifiable_tasks.txt before copying into artifacts/tasks/.

    # harbor_job:
    #   jobs_dir: artifacts/jobs
    #   dataset_path: artifacts/tasks/py-cc   # points to verified py-cc tasks only
    #   n_concurrent: 1
    #   n_tasks: null
    #   max_retries: 2
    #   timeout_multiplier: 5


    # TESTRUN (disabled): HuggingFace dataset path, do not delete — used for smoke tests.
    task_source:
      provider: huggingface
      dataset_name: SWE-Lego/swerebenchv2-200-260429
      split: train

    harbor_job:
      # This is the trajgen block output root for Harbor job results.
      # Store jobs under this block's artifacts directory, not under repos/harbor.
      # scripts/start.sh exports this as TRAJGEN_HARBOR_JOBS_DIR.
      jobs_dir: artifacts/jobs
      n_concurrent: 8
      n_tasks: 40                     # cap per swegen→trajgen run target (set to 1 for smoke tests, null for all manifest tasks)
      max_retries: 2
      timeout_multiplier: 5

    agent:
      name: custom-claude-code
      version: 2.1.118
      runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      runtime_host_path: artifacts/agent-runtime/claude-code  # pre-extracted from runtime_image via docker cp; user-owned (gpufs root_squash blocks docker daemon writes to root-owned dirs)
      max_turns: 80
      temperature: 0.7

    sft_conversion:
      enabled: false               # if true, start.sh runs convert step after Harbor job finishes
      scaffold: auto               # auto | claude_code | open_code | openhands_sdk | terminus2 (auto = derive from agent.name)
      out_dir: artifacts/sft_data  # per-job subdir created inside this
      max_instances: null
      exclude_repos_file: ""       # "" = use repo default artifacts/excluded_repos.txt

  output:
    raw_trajectories_dir:
      description: Harbor job directories with LiteLLM trajectory logs
      path: artifacts/jobs
      trajectory_format: "artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl"
      consumer_block: sft
    sft_data_dir:
      description: LF-format JSON arrays converted from Harbor trajectories, ready for LLaMA-Factory SFT.
      path: artifacts/sft_data
      format: llamafactory_lf_v0.1
      trajectory_format: "artifacts/sft_data/<job>/lf.json"
      consumer_block: sft

environment:
  extra:
    # Tasks excluded from trajgen runs: prior failures (timeout/OOM) + tasks already
    # consumed per artifacts/consumption_ledger.yaml (status: done | skipped).
    HARBOR_EXCLUDE_TASKS: elastic__elasticsearch-py-3329 elastic__elasticsearch-py-3332 cartography-cncf__cartography-1673 agentscope-ai__agentscope-885 agentscope-ai__agentscope-1342 aider-ai__aider-4146 agentscope-ai__agentscope-964 django-guardian__django-guardian-677 567-labs__instructor-1897 cartography-cncf__cartography-1751 cartography-cncf__cartography-2031

status:
  phase: idle
  progress: "Ready for the next trajectory generation run."
  next_steps: |
    1. Run scripts/dryrun.sh before starting a new Harbor job.
    2. Confirm swegen has verified tasks before preparing trajgen inputs.
  blockers: null
  last_updated: null

evolving:
  description: Generates agent trajectories using Harbor. Tunable parameters include agent sampling settings, Harbor concurrency, and timeout multipliers.
  tunable_params:
    temperature: "Agent sampling temperature (0.0-1.0)"
    max_turns: "Maximum agent turns per task"
    n_concurrent: "Harbor concurrent tasks"
    timeout_multiplier: "Task timeout multiplier"
