# ─── Identity ────────────────────────────────────────────────────────────────

name: trajgen
label: "Trajectory Generation"

# root | pipeline | training | evaluation | data | utility | leaf
role: data

summary: >
  Generates raw agent trajectories with Harbor for downstream SFT data conversion.
  Harbor is managed as a local-only repository under repos/harbor and is updated
  on demand through the block scripts. Prepared datasets, Harbor jobs,
  trajectory logs, and run logs are stored under artifacts/.

# ─── Tree Position ────────────────────────────────────────────────────────────

parent: swe_lego_live

children: []

# ─── Resources ───────────────────────────────────────────────────────────────

resources:
  cpu: null
  gpu: null
  memory: null
  estimated_runtime: "depends on Harbor rollout batch size and selected agent runtime"
  model_api:
    description: >
      Raw upstream model API used to configure per-job LiteLLM proxy startup.
      Supports OpenAI-compatible and Anthropic-compatible upstreams, including
      upstream model name, API base, API key, and token cost metadata.
    protocols: [openai_compatible, anthropic_compatible]
    served_via: per_job_litellm_proxy

# ─── Repos ───────────────────────────────────────────────────────────────────

repos:
  - path: repos/harbor
    role: trajectory generation runtime (managed local-only dependency)

# ─── Input Dependencies ──────────────────────────────────────────────────────

inputs:
  - name: repositories
    description: Managed Harbor checkout URL, branch, pinned commit, local path, and read-only policy
    source_block: null
    path: config.yaml

  - name: environment
    description: Harbor uv environment plus LiteLLM uv proxy environment and version expectations
    source_block: null
    path: config.yaml

  - name: model_api
    description: Raw upstream model endpoint, API key, model name, and token cost metadata used to generate each job's LiteLLM config
    source_block: null
    path: config.yaml

  - name: litellm_proxy
    description: LiteLLM config template, proxy port, and master key used by each generated job
    source_block: null
    path: config.yaml

  - name: task_source
    description: >
      Source dataset identity for Harbor rollouts. Local Harbor task directories
      are derived under artifacts/tasks/.
    source_block: null
    path: config.yaml

  - name: harbor_job
    description: Harbor jobs_dir, concurrency, retry, timeout, and smoke-test limit settings
    source_block: null
    path: config.yaml

  - name: agent
    description: Harbor agent name, version, runtime image, max turns, and sampling parameters
    source_block: null
    path: config.yaml

# ─── Artifacts ────────────────────────────────────────────────────────────────

artifacts:
  - path: artifacts/env
    role: Local uv/Python environments used by trajgen runtime checks

  - path: artifacts/tasks
    role: Downloaded or prepared Harbor task directories

  - path: artifacts/jobs
    role: Harbor job outputs, including per-task agent/verifier files

  - path: artifacts/litellm
    role: Generated per-job LiteLLM proxy configs

  - path: artifacts/logs
    role: trajgen script stdout/stderr logs

# ─── Output Dependencies ─────────────────────────────────────────────────────

outputs:
  - name: raw_trajectories
    description: >
      Harbor job directories and LiteLLM trajectory logs produced under
      artifacts/jobs. Each task trajectory is expected at
      artifacts/jobs/<job>/<task>/agent/litellm-trajectory.jsonl.
    consumer_block: sft_training
    path: artifacts/jobs

# ─── Navigation ──────────────────────────────────────────────────────────────

main: dashboard/overview.mdx
guide: CLAUDE.md
status: status.yaml
