# ─── Identity ────────────────────────────────────────────────────────────────

name: rl_training
label: "RL Training"

# root | pipeline | training | evaluation | data | utility | leaf
role: training

summary: >
  Online RL training pipeline for SWE-bench. Trains a configurable coding agent against
  a local LLM served by vLLM, using Harbor on Kubernetes as the task execution layer
  and rLLM + verl as the RL backbone (GRPO/GSPO). Reward is binary: 1 if the agent's
  patch resolves the SWE-bench issue, 0 otherwise.

# ─── Tree Position ────────────────────────────────────────────────────────────

parent: swe_lego_live

children: []

# ─── Resources ───────────────────────────────────────────────────────────────

resources:
  cpu: null
  gpu: "8× A100/H100 per node"
  memory: null
  estimated_runtime: "hours per training run"

# ─── Repos ───────────────────────────────────────────────────────────────────

repos:
  - path: repos/harbor-verl-train
    role: RL training framework (rLLM + verl, GRPO/GSPO)
  - path: repos/harbor
    role: task execution layer (Harbor on Kubernetes)

# ─── Input Dependencies ──────────────────────────────────────────────────────

inputs:
  - name: base_model
    description: Model checkpoint to initialize RL training from
    source_block: null
    path: inputs.yaml
    required: true

  - name: training_dataset
    description: Curated SWE-bench parquet (task instances for training)
    source_block: null
    path: inputs.yaml
    required: true

  - name: val_dataset
    description: SWE-bench parquet for validation
    source_block: null
    path: inputs.yaml
    required: true

  - name: harbor_task_dirs
    description: Pre-processed Harbor task directories (parquet → per-instance dirs)
    source_block: null
    path: inputs.yaml
    required: true

  - name: train_config
    description: Hydra training config and LiteLLM proxy configs
    source_block: null
    path: inputs.yaml
    required: true

# ─── Output Dependencies ─────────────────────────────────────────────────────

outputs:
  - name: checkpoint_path
    description: Path to the latest trained actor model checkpoint
    consumer_block: null
    path: outputs.yaml

  - name: val_resolve_rate
    description: SWE-bench-Verified resolve rate (%) for the best checkpoint
    consumer_block: null
    path: outputs.yaml

  - name: training_curves
    description: WandB run with reward, loss, token counts, and timing metrics
    consumer_block: null
    path: outputs.yaml

# ─── Navigation ──────────────────────────────────────────────────────────────

main: dashboard/overview.mdx
guide: CLAUDE.md
status: status.yaml
