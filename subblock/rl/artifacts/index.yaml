version: 1

primary_artifacts:
  - model_checkpoints
  - training_log

artifacts:
  model_checkpoints:
    description: Actor checkpoints saved during training
    path: repos/harbor-verl-train/outputs/
    producer: scripts/train_1node.sh

  training_log:
    description: Per-run training log written by train_1node.sh
    path: repos/harbor-verl-train/logs/
    pattern: "harbor_swe_cc_1node_*.log"
    producer: scripts/train_1node.sh

  trajectory_logs:
    description: JSONL files of all agent API traffic from rollouts (trajectory_logger.py)
    path: /tmp/trajectory_output_dir/
    producer: scripts/train_1node.sh
    note: Ephemeral — copy to artifacts/files/ after each run

  train_script:
    description: Portable 1-node training launch script for this block
    path: scripts/train_1node.sh

  pipeline_doc:
    description: Detailed pipeline architecture, data flow, and bug fix record
    url: https://github.com/Elvin-Yiming-Du/harbor-verl-train/blob/main/examples/harbor/scripts/TRAINING_PIPELINE.md

  local_files:
    description: Persistent copies of trajectory logs and exported reports
    path: artifacts/files/

notes:
  - trajectory_logs are ephemeral at /tmp — copy to artifacts/files/ after each run
  - checkpoints can be large; do not commit to git
