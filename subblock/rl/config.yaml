evolving:
  description: >-
    Single-node sync RL training (claude-code agent + Harbor k8s sandbox).
    Most knobs surface as env vars to sync_1nodes_cc.sh — anything in
    runtime_info.input can be tuned without touching scripts.
  tunable_params:
    train_batch_size: "Training batch size (data.train_batch_size)"
    n_resp_per_prompt: "Rollouts sampled per prompt"
    max_prompt_length: "Per-trial prompt budget (40k default)"
    max_response_length: "Per-trial response budget (68k default)"
    vllm.gen_tp: "vLLM tensor parallelism — must divide num_key_value_heads"
    vllm.max_model_length: "vLLM context window (128k default)"
    harbor_runtime.num_workers: "Parallel Harbor trials per training step (16 cold → 96 steady)"
    harbor_runtime.tail_kill_target: "1.0 OFF; 0.95 kills slowest 5% per step after grace"
    harbor_agent.max_timeout_sec: "Per-trial agent_execute cap (2400s = sync-tuned p99)"
