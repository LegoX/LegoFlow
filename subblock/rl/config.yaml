meta_info:
  name: rl
  label: "RL Training"
  description: >-
    Online RL training pipeline for SWE-bench. Wraps the
    harbor-verl-train sync_1nodes_cc launch path: claude-code (mounted in a k8s
    pod) → LiteLLM proxy → vLLM (verl-managed). PPO/GRPO updates are driven by
    verl over Harbor-executed agent trajectories.
  parent: swe_lego_live
  subblocks: {}
  dependencies:
    base_model_checkpoint: sft.output.checkpoint_path  # path: subblock/sft/artifacts/model/<run>/checkpoint-N

  repos:
    harbor_verl_train:
      name: harbor-verl-train
      url: https://github.com/Elvin-Yiming-Du/harbor-verl-train.git
      branch: ydu_dev
      role: RL training framework (verl trainer/rollout + Harbor agent loop bridge)
    harbor:
      name: harbor
      url: https://github.com/SWE-Lego/harbor.git
      branch: ydu_dev
      pinned_commit: 9f98f9d69e37b1c7423fb2ec0fdf50b754877057  # see harbor-verl-train/scripts/setup_env.sh
      role: Task execution layer (Harbor on Kubernetes) + verifier reward
    verl:
      name: verl
      url: https://github.com/verl-project/verl.git
      pinned_commit: bcb638649  # see harbor-verl-train/scripts/setup_env.sh; patched with patches/verl_bcb638649.patch
      role: Trainer + rollout (FSDP, PPO/GRPO/GSPO)

  environment:
    bootstrap_script: repos/harbor-verl-train/scripts/setup_env.sh
    venv_path: repos/harbor-verl-train/.venv
    requirements: repos/harbor-verl-train/pyproject.toml

  resources:
    ip: null
    pwd: null
    apikey: null
    model: null
    public_storage: null
    gpu: "8× A100/H100 per node"
    estimated_runtime: "hours per training run"

runtime_info:
  input:
    # ---------------------------------------------------------------------
    # Model
    # ---------------------------------------------------------------------
    model:
      model_path: /mnt/public/models/Qwen3-30B-A3B-Instruct-2507
      served_model_name: vllm_model

    # ---------------------------------------------------------------------
    # Data — pre-built parquet task indexes (output of create_task_index.py)
    # ---------------------------------------------------------------------
    data:
      data_dir: /mnt/ydu/data/harbor_indexes
      train_index: /mnt/ydu/data/harbor_indexes/train_rebench1663.parquet
      val_index: /mnt/ydu/data/harbor_indexes/val_official500.parquet

    # ---------------------------------------------------------------------
    # Infrastructure
    # ---------------------------------------------------------------------
    infrastructure:
      node0_ip: ""               # auto-detected via `hostname -I` if empty
      nnodes: 1
      ngpus_per_node: 8
      ray_port: 6379
      ray_dashboard_port: 8265
      litellm_port: 8002
      vllm_logging_level: INFO
      anthropic_api_key: sk-dummy   # dummy placeholder for LiteLLM's Anthropic shim — proxied to local vLLM, not real Anthropic

    # ---------------------------------------------------------------------
    # Python environment
    # ---------------------------------------------------------------------
    environment:
      # Empty → use the default `repos/harbor-verl-train/.venv` (built by
      # setup_env.sh on first run via scripts/start.sh).
      # Set this to point at an existing venv (absolute path or relative to
      # this block) to skip bootstrap and reuse a prebuilt environment.
      # The venv MUST have harbor / verl / harbor-verl-train installed
      # editable; mismatched paths will silently run the wrong code.
      venv_path: ""

    # ---------------------------------------------------------------------
    # Kubernetes (Harbor sandbox)
    # ---------------------------------------------------------------------
    k8s:
      kubeconfig: /mnt/ydu/k8s-cpu-221.yaml
      namespace: default
      pod_startup_timeout: 1200
      pod_active_deadline_seconds: 6000

    # ---------------------------------------------------------------------
    # vLLM rollout — UPSTREAM-FIXED. These mirror the hardcoded values in
    # repos/harbor-verl-train/scripts/sync_1nodes_cc.sh (gen_tp,
    # vllm_max_model_length, gpu_memory_utilization, etc.) so this file
    # documents the run-time state. Editing here does NOT change the run;
    # to override, edit the upstream script.
    # ---------------------------------------------------------------------
    vllm:
      gen_tp: 4                  # TP=4 + DP=2 on 8GPU; matches Qwen3-30B-A3B's 4 KV heads
      max_model_length: 128000
      gpu_memory_utilization: 0.85
      max_num_seqs: 96
      enforce_eager: false
      dtype: bfloat16
      enable_chunked_prefill: true

    # ---------------------------------------------------------------------
    # Training — UPSTREAM-FIXED (same caveat as vllm above). Only test_freq
    # is currently env-driven; the rest are documentation of upstream values.
    # ---------------------------------------------------------------------
    training:
      train_batch_size: 64
      val_batch_size: 500
      n_resp_per_prompt: 8
      train_prompt_mini_batch_size: 64
      max_prompt_length: 40000
      max_response_length: 68000
      sp_size: 4                  # ulysses sequence parallel
      use_dynamic_bsz: true
      ref_offload: true
      actor_offload: true
      total_epochs: 3
      save_freq: 5
      test_freq: 5
      val_before_train: false

    # ---------------------------------------------------------------------
    # Algorithm — UPSTREAM-FIXED (documentation only).
    # ---------------------------------------------------------------------
    algorithm:
      adv_estimator: grpo
      policy_loss_mode: gspo
      learning_rate: 1.0e-6
      use_kl_loss: false
      kl_loss_coef: 0.001
      kl_loss_type: low_var_kl
      clip_ratio_low: 3.0e-4
      clip_ratio_high: 4.0e-4
      entropy_coeff: 0.0
      loss_agg_mode: seq-mean-token-mean
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      val_temperature: 0
      val_top_p: 1.0
      val_top_k: -1

    # ---------------------------------------------------------------------
    # Harbor agent loop (claude-code, mounted runtime image)
    # ---------------------------------------------------------------------
    harbor_agent:
      agent_name: claude-code
      agent_import_path: harbor_patch.agents.image_mounted_claude_code:ClaudeCode
      runtime_image: docker.io/jierun/c-cc-2.1.118:v0.1
      runtime_mount_path: /opt/custom-agent-runtime/claude-code
      runtime_image_subpath: opt/custom-agent-runtime/claude-code
      max_iterations: 100
      max_timeout_sec: 2400        # per-trial agent_execute cap
      override_timeout_sec: 2400
      disable_tool_calls: false
      temperature: 1.0
      max_retries: 2
      verifier_enabled: true
      pod_name_prefix: swe-lego-live-rl
      agent_setup_timeout_multiplier: 1.0
      agent_timeout_multiplier: 1.0
      verifier_timeout_multiplier: 1.0
      environment_build_timeout_multiplier: 1.0
      environment_type: null
      environment_import_path: harbor_patch.environments.kubernetes.kubernetes:KubernetesEnvironment
      environment_force_build: false
      environment_delete: true
      environment_override_cpus: 1

    # ---------------------------------------------------------------------
    # Harbor parallelism + tail-killer
    # ---------------------------------------------------------------------
    harbor_runtime:
      num_workers: 16              # parallel Harbor trials per training step (16 cold; 32–96 steady)
      tail_kill_target: 1.0        # 1.0 = OFF; 0.95 → kill slowest 5% after grace
      tail_kill_grace_sec: 180
      tail_kill_min_tasks: 32

    # ---------------------------------------------------------------------
    # Experiment / logging
    # ---------------------------------------------------------------------
    experiment:
      project_name: swe-lego-live-rl
      exp_name: ""                 # empty → auto-generated as harbor-cc-sync-1n-<UTC timestamp>
      trials_dir: ""               # empty → repos/harbor-verl-train/harbor_trials/<project>/<exp>
      trajectory_logger_src: /mnt/ydu/SWE-Lego-Live-RL/subblock/rl/repos/harbor/scripts/serve_llm/trajectory_logger.py

    # ---------------------------------------------------------------------
    # Credentials — do NOT commit secrets here.
    # Set WANDB_API_KEY via env var (e.g. in your shell rc, or `export
    # WANDB_API_KEY=...` before `bash scripts/start.sh`). dryrun.sh fails
    # if neither this field nor $WANDB_API_KEY is set. To opt out entirely,
    # set wandb_mode: disabled.
    # ---------------------------------------------------------------------
    credentials:
      wandb_api_key: ""            # leave empty — provide via $WANDB_API_KEY env
      wandb_mode: online           # online | offline | disabled

  output:
    checkpoint_path:
      description: Path to the latest trained actor model checkpoint (verl FSDP shards)
      value: null
      path: repos/harbor-verl-train/checkpoints/

    val_resolve_rate:
      description: SWE-bench-Verified resolve rate (%) for the best checkpoint
      value: null

    training_curves:
      description: WandB run with reward, loss, token counts, timing metrics
      value: null
      wandb_run_id: null

    training_log:
      description: Per-run training log written by sync_1nodes_cc.sh
      path: repos/harbor-verl-train/logs/
      pattern: "<exp_name>.log"

    vllm_log:
      description: vLLM throughput-only filtered log (tee'd from main log)
      path: repos/harbor-verl-train/logs/
      pattern: "<exp_name>_vllm.log"

    trajectory_log:
      description: Per-trial JSONL of all LiteLLM API traffic (litellm trajectory_logger callback)
      path: repos/harbor-verl-train/harbor_trials/<project_name>/<exp_name>/
      pattern: "**/litellm-trajectory.jsonl"

