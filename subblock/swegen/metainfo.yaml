name: swegen
label: "SWE-gen"

# root | pipeline | training | evaluation | data | utility | leaf
type: data

summary: >
  Converts GitHub PRs into verified SWE-Bench tasks across 8 programming languages.
  Runs as an adaptive agent that monitors per-language success rates and tunes
  pipeline parameters (timeout, cc_timeout, n_concurrent) automatically.

