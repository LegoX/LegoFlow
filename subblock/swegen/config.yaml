meta_info:
  name: swegen
  label: "SWE-gen"
  description: Converts GitHub PRs into verified SWE-Bench tasks across 8 programming languages. Runs as an adaptive agent that monitors per-language success rates and tunes pipeline parameters automatically.
  parent: swe_lego_live
  subblocks: {}

  repos:
    swegen:
      name: swegen
      commit_id: null # latest
      role: core pipeline — CLI, task generation, validation, scoring

  environment:
    venv_name: swegen-env2
    venv_path: artifacts/envs/swegen-env2
    requirements: repos/swegen/pyproject.toml
    python_version: "3.10+"
    description: Virtual environment for swegen CLI and dependencies

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: root
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

runtime_info:
  input:
    github_tokens: human              # Comma-separated GitHub API tokens for PR collection

    llm_api:
      api_key: dummy-key
      api_base_url: "http://llm10.jierungogogo.com/v1"
      pr_model: "openai/MiniMax-M2.7"
      task_model: "openai/MiniMax-M2.7"

    # llm_api:
    #   api_key: human             # LLM API key for PR evaluation and instruction generation
    #   api_base_url: https://az.gptplus5.com/v1        # OpenAI-compatible API endpoint
    #   pr_model: deepseek-v4-flash               # Model for PR evaluation and instruction generation
    #   task_model: deepseek-v4-flash            # Model for Claude Code SDK task completion

    # Adaptive tuning configuration
    global:
      monitor_interval_min: 30
      pr_pool_min_threshold: 100
      collect_pr_defaults:
        repo_num: 100
        max_prs_per_repo: 50
      restart_policy:
        allowed: true
        zero_success_cycles: 3
      param_bounds:
        timeout:
          min: 2400
          max: 5400
          step: 400
        cc_timeout:
          min: 1800
          max: 4200
          step: 300
        n_concurrent:
          min: 4
          max: 32
          step: 4

    languages:
      py:
        enabled: true
        params:
          timeout: 3200
          cc_timeout: 2400
          n_concurrent: 20
        status:
          total_success: 3
          total_failed: 1
          total_filtered: 1
          pr_pool_remaining: 10
          last_round_success: 1
          last_round_failed: 1
          success_rate: 0.5
          zero_success_streak: 0
          last_checked: '2026-04-22T12:00:06.085014+00:00'
      js:
