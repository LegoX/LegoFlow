    github_tokens: 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              # Comma-separated GitHub API tokens for PR collection

    llm_api:
      api_key: dummy-key
      api_base_url: "http://llm10.jierungogogo.com/v1"
      pr_model: "MiniMax-M2.7"
