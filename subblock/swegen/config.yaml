meta_info:
  name: swegen
  label: "SWE-gen"
  description: Converts GitHub PRs into verified SWE-Bench tasks across 8 programming languages. Runs as an adaptive agent that monitors per-language success rates and tunes pipeline parameters automatically.
  parent: swe_lego_live
  subblocks: {}

  repos:
    swegen:
      name: swegen
      commit_id: null # latest
      role: core pipeline - CLI, task generation, validation, scoring

  environment:
    venv_name: swegen-env
    venv_path: artifacts/envs/swegen-env
    requirements: repos/swegen/pyproject.toml
    python_version: "3.10+"
    description: Virtual environment for swegen CLI and dependencies

  resources:
    ip: local        # CPU-only; runs on any node with Docker available
    user: root
    pwd: null
    directory: /gpufs/haoli/code/
    description: cpu node server for k8s cluster. By default you should work at ${directory}
    public_storage: null

runtime_info:
  input:
    github_tokens: human              # Comma-separated GitHub API tokens, or place them in gh_token.txt

    # =========================================================================
    # LLM configuration - the main thing a user edits before a run.
    #
    # swegen calls the LLM over TWO different API paths. Set both correctly or
    # task verification fails SILENTLY (no verifiable_tasks.txt is written, yet
    # batch state still shows success - see CLAUDE.md "LLM provider modes").
    #
    #   1. OpenAI-compatible path (api_base_url + pr_model):
    #        PR evaluation and task-instruction generation.
    #   2. Claude Code path (Anthropic /v1/messages, task_model):
    #        task completion AND the verification step that writes
    #        verifiable_tasks.txt.
    #
    # cc_provider_mode selects how the Claude Code path reaches your provider:
    #   native       - provider already speaks the Anthropic Messages API
    #                  (real Claude, or a gateway exposing /v1/messages).
    #                  anthropic_base_url points straight at the provider.
    #   openai_proxy - provider is OpenAI-only (Qwen / GLM / sglang / vLLM and
    #                  most self-hosted endpoints, which reject role:system on
    #                  /v1/messages with HTTP 400). A local LiteLLM proxy
    #                  translates Anthropic -> OpenAI. anthropic_base_url must
    #                  point at that proxy. REQUIRED for OpenAI-only providers.
    # =========================================================================
    llm_api:
      # --- OpenAI-compatible path ---
      api_key: <YOUR_API_KEY>                 # never commit a real key; prefer env/.env
      api_base_url: https://your-endpoint/v1
      pr_model: Qwen3.6-35B-A3B

      # --- Claude Code path (task completion + verification) ---
      task_model: claude-sonnet-4-6           # for openai_proxy this is just the proxy alias
      cc_provider_mode: openai_proxy          # native | openai_proxy
      anthropic_base_url: http://127.0.0.1:4010  # native: provider URL | openai_proxy: local proxy URL
      cc_proxy_port: 4010                     # openai_proxy only: local LiteLLM proxy port

    # Adaptive tuning bounds (read by the monitoring agent; see CLAUDE.md)
    global:
      monitor_interval_min: 30
      pr_pool_min_threshold: 100
      collect_pr_defaults:
        repo_num: 100
        max_prs_per_repo: 50
      restart_policy:
        allowed: true
        zero_success_cycles: 3
      param_bounds:
        timeout:    { min: 2400, max: 5400, step: 400 }
        cc_timeout: { min: 1800, max: 4200, step: 300 }
        n_concurrent: { min: 4, max: 32, step: 4 }

    # Per-language tunables consumed by scripts/read_params.py + scripts/create_<lang>.sh.
    # Set enabled:false to skip a language. Live status/metrics are NOT stored here
    # (config.yaml is one-shot); look at artifacts/index.yaml for run state.
    languages:
      py:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 20 } }
      js:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      ts:   { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16 } }
      go:   { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      c:    { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      cpp:  { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      java: { enabled: true,  params: { timeout: 3200, cc_timeout: 2400, n_concurrent: 16 } }
      rust: { enabled: true,  params: { timeout: 3600, cc_timeout: 3000, n_concurrent: 16 } }

  output:
    swe_tasks_dir:
      path: artifacts/swe_tasks
      description: Per-language task directories ({lang}-cc/), each with verifiable_tasks.txt listing verified task IDs
      structure: "artifacts/swe_tasks/{lang}-cc/{task_id}/ with instruction.md, environment/, solution/, tests/"

    merged_tasks_dir:
      path: artifacts/merged_swe_tasks
      description: Optional flattened directory containing all verified tasks from all languages (populated by scripts/extract_verified_tasks.py)
      structure: "artifacts/merged_swe_tasks/{task_id}/ with instruction.md, environment/, solution/, tests/"
      extract_command: python scripts/extract_verified_tasks.py

    logs:
      dir: artifacts/logs/swegen-create
      description: "Per-language create logs cc_<lang>_March.txt; adaptive decisions in artifacts/logs/adaptive_decisions.jsonl"

status:
  phase: idle
  progress: "Ready for the next SWE task generation run."
  next_steps: |
    1. Set runtime_info.input.llm_api (especially cc_provider_mode) before a run.
    2. Run scripts/dryrun.sh to preflight env, package, Docker, and the CC proxy.
    3. Use memory/quick-verify.md for a small end-to-end check when changing the runtime.
  blockers: null
  last_updated: null

evolving:
  description: Adaptive agent that monitors per-language success rates and tunes pipeline parameters (timeout, cc_timeout, n_concurrent) automatically every 30 minutes.
  tunable_params:
    timeout: "Per-language task timeout (2400-5400s)"
    cc_timeout: "Per-language Claude Code timeout (1800-4200s)"
    n_concurrent: "Per-language concurrent tasks (4-32)"
