    fill="none"
    stroke="#fb7185"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <g fill="#fb7185" stroke="#0b1220" stroke-width="2">
    <circle cx="90" cy="166.8" r="4"/>
    <circle cx="126.1" cy="135.6" r="4"/>
    <circle cx="162.2" cy="146.7" r="4"/>
    <circle cx="198.3" cy="144.4" r="4"/>
    <circle cx="234.3" cy="170.1" r="4"/>
    <circle cx="270.4" cy="221.7" r="4"/>
    <circle cx="306.5" cy="214.4" r="4"/>
    <circle cx="342.6" cy="277.7" r="4"/>
    <circle cx="378.7" cy="297.7" r="4"/>
    <circle cx="414.8" cy="315.7" r="4"/>
    <circle cx="450.9" cy="336.2" r="4"/>
    <circle cx="487" cy="342.1" r="4"/>
    <circle cx="523" cy="332.4" r="4"/>
    <circle cx="559.1" cy="370" r="4"/>
    <circle cx="595.2" cy="334.6" r="4"/>
    <circle cx="631.3" cy="355.8" r="4"/>
    <circle cx="667.4" cy="406.9" r="4"/>
    <circle cx="703.5" cy="407.3" r="4"/>
    <circle cx="739.6" cy="396.3" r="4"/>
    <circle cx="775.7" cy="402.5" r="4"/>
    <circle cx="811.7" cy="403.3" r="4"/>
    <circle cx="847.8" cy="409.4" r="4"/>
    <circle cx="883.9" cy="424.2" r="4"/>
    <circle cx="920" cy="403.4" r="4"/>
