<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Training loss and learning-rate curves for the Qwen3.5 35B SFT example</title>
  <desc id="desc">Across 24 optimizer steps, loss falls from 0.5097 to 0.2313 while learning rate warms up to 5e-5 at step 4 and then follows cosine decay.</desc>
  <rect width="1000" height="560" rx="18" fill="#0b1220"/>

  <text x="50" y="44" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Qwen3.5-35B full SFT - training curves</text>
  <text x="50" y="69" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">512 samples - 3 epochs - effective batch 64 - 24 optimizer steps</text>

  <g stroke="#273449" stroke-width="1">
    <line x1="90" y1="90" x2="920" y2="90"/>
    <line x1="90" y1="175" x2="920" y2="175"/>
    <line x1="90" y1="260" x2="920" y2="260"/>
    <line x1="90" y1="345" x2="920" y2="345"/>
    <line x1="90" y1="430" x2="920" y2="430"/>
  </g>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="90" y1="90" x2="90" y2="430"/>
    <line x1="920" y1="90" x2="920" y2="430"/>
    <line x1="90" y1="430" x2="920" y2="430"/>
  </g>

  <g stroke="#64748b" stroke-width="1" stroke-dasharray="5 7">
    <line x1="342.6" y1="90" x2="342.6" y2="430"/>
    <line x1="631.3" y1="90" x2="631.3" y2="430"/>
  </g>
  <g fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <text x="210" y="108" text-anchor="middle">epoch 1</text>
    <text x="487" y="108" text-anchor="middle">epoch 2</text>
    <text x="776" y="108" text-anchor="middle">epoch 3</text>
  </g>

  <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="end">
    <text x="78" y="94">0.6</text>
    <text x="78" y="179">0.5</text>
    <text x="78" y="264">0.4</text>
    <text x="78" y="349">0.3</text>
    <text x="78" y="434">0.2</text>
  </g>
  <text x="24" y="260" fill="#fb7185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(-90 24 260)">loss</text>

  <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">
    <text x="932" y="94">5.00</text>
    <text x="932" y="179">3.75</text>
    <text x="932" y="264">2.50</text>
    <text x="932" y="349">1.25</text>
    <text x="932" y="434">0</text>
  </g>
  <text x="978" y="260" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(90 978 260)">learning rate (x 10^-5)</text>

  <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">
    <text x="90" y="452">1</text>
    <text x="198.3" y="452">4</text>
    <text x="342.6" y="452">8</text>
    <text x="487" y="452">12</text>
    <text x="631.3" y="452">16</text>
    <text x="775.7" y="452">20</text>
    <text x="920" y="452">24</text>
  </g>
  <text x="505" y="481" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">optimizer step</text>

